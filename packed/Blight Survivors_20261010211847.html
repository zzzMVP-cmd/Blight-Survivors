<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blight Survivors</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0a12;
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #game { display:block; width:100%; height:100%; cursor:crosshair; }
  .overlay {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(8,8,16,0.88);
    backdrop-filter:blur(6px);
    z-index:10; color:#e8e8f0;
    overflow-y:auto;
  }
  .overlay.hidden { display:none; }
  h1 {
    font-size:clamp(28px,6vw,54px);
    letter-spacing:4px; margin-bottom:6px;
    background:linear-gradient(180deg,#ffd76e,#ff8a3d);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 30px rgba(255,140,60,.4);
  }
  .subtitle { color:#8a8aa0; margin-bottom:28px; font-size:14px; letter-spacing:2px; }
  .btn {
    padding:14px 44px; margin:8px;
    font-size:17px; letter-spacing:2px;
    color:#1a1208; font-weight:700;
    background:linear-gradient(180deg,#ffd76e,#ffa83d);
    border:none; border-radius:8px; cursor:pointer;
    box-shadow:0 4px 0 #b56a1a, 0 6px 18px rgba(255,150,60,.35);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #b56a1a; }
  .btn.secondary {
    background:linear-gradient(180deg,#4a4a66,#2e2e44);
    color:#d8d8e8; box-shadow:0 4px 0 #1a1a2a;
    font-weight:600; padding:12px 32px; font-size:15px;
  }
  .btn.secondary:active { box-shadow:0 1px 0 #1a1a2a; }
  .btn-row {
    display:flex; gap:12px; align-items:center; justify-content:center;
    flex-wrap:wrap; margin-top:8px;
  }
  .hero-grid { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:10px 0 20px; max-width:960px; }
  .hero-card {
    width:160px; padding:14px 10px;
    background:rgba(30,30,48,.9);
    border:2px solid #3a3a55; border-radius:12px;
    cursor:pointer; transition:.15s; text-align:center;
  }
  .hero-card:hover { border-color:#ffb84d; transform:translateY(-3px); }
  .hero-card.locked { opacity:.45; cursor:not-allowed; }
  .hero-card.locked:hover { transform:none; border-color:#3a3a55; }
  .hero-fragments { font-size:12px; color:#c878ff; margin-top:6px; font-weight:700; }
  .hero-icon { font-size:30px; margin-bottom:6px; }
  .hero-name { font-weight:700; font-size:15px; color:#ffd76e; margin-bottom:4px; }
  .hero-desc { font-size:11px; color:#9a9ab0; line-height:1.4; }
  .hero-cost { font-size:12px; color:#7ee08a; margin-top:6px; font-weight:700; }
  .hero-weapon { font-size:10px; color:#c8a86a; margin-top:6px; letter-spacing:1px; }
  .stat-row { display:flex; gap:28px; margin:14px 0; flex-wrap:wrap; justify-content:center; }
  .stat { text-align:center; }
  .stat-val { font-size:26px; font-weight:700; color:#ffd76e; }
  .stat-label { font-size:11px; color:#8a8aa0; letter-spacing:1px; margin-top:2px; }

  .shop-wrap { max-width:900px; width:100%; padding:20px; }
  .shop-head {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; padding-bottom:14px;
    border-bottom:1px solid #33334a;
  }
  .shop-title {
    font-size:28px; letter-spacing:4px; font-weight:700;
    background:linear-gradient(180deg,#ffd76e,#ff8a3d);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .shop-gold { font-size:16px; color:#ffd76e; font-weight:700; }
  .shop-grid {
    display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    max-height:60vh; overflow-y:auto;
    padding-right:6px;
  }
  .shop-item {
    background:rgba(28,28,46,.95);
    border:2px solid #4a4a70; border-radius:12px;
    padding:14px 12px; text-align:center;
    transition:.15s;
  }
  .shop-item:hover { border-color:#ffd76e; }
  .shop-item-icon { font-size:34px; margin-bottom:6px; }
  .shop-item-name { font-weight:700; font-size:15px; color:#ffd76e; margin-bottom:4px; }
  .shop-item-desc { font-size:11px; color:#a8a8c0; line-height:1.4; min-height:32px; }
  .shop-item-owned { font-size:11px; color:#7ee08a; margin-top:6px; font-weight:700; }
  .shop-item-price {
    display:inline-block; margin-top:8px;
    padding:6px 14px; border-radius:8px;
    background:linear-gradient(180deg,#ffd76e,#ffa83d);
    color:#1a1208; font-weight:700; font-size:13px;
    cursor:pointer; user-select:none;
    box-shadow:0 2px 0 #b56a1a;
  }
  .shop-item-price:active { transform:translateY(2px); box-shadow:0 0 0 #b56a1a; }
  .shop-item-price.disabled { opacity:.35; cursor:not-allowed; }
  .shop-item-price-row {
    display:flex; gap:6px; justify-content:center;
    margin-top:8px; flex-wrap:wrap;
  }
  .shop-item-price.small {
    padding:6px 10px; font-size:11px;
    min-width:0; box-shadow:0 2px 0 #b56a1a;
  }

  #itemBar {
    position:fixed; right:12px; bottom:78px;
    display:flex; flex-direction:column; gap:6px;
    z-index:6;
  }
  .item-slot {
    width:46px; height:46px;
    background:rgba(25,35,55,0.85);
    border:2px solid #5a5a80; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    position:relative; cursor:pointer;
    transition:.15s;
    font-size:22px;
  }
  .item-slot:hover { border-color:#ffd76e; }
  .item-slot.empty { opacity:.35; cursor:not-allowed; }
  .item-slot.empty:hover { border-color:#5a5a80; }
  .item-slot .item-count {
    position:absolute; bottom:-3px; right:-3px;
    background:#ffd76e; color:#1a1208;
    font-size:10px; font-weight:700;
    border-radius:8px; padding:1px 5px;
    min-width:16px; text-align:center;
  }
  .item-slot .item-key {
    position:absolute; top:-3px; left:-3px;
    background:rgba(20,20,34,.9); color:#c8c8d8;
    font-size:9px; font-weight:700;
    border-radius:6px; padding:1px 4px;
    border:1px solid #4a4a70;
  }

  #buffBar {
    position:fixed; left:12px; bottom:78px;
    display:flex; flex-direction:column; gap:6px;
    z-index:6;
  }
  .buff-item {
    background:rgba(25,35,55,0.85);
    border:1px solid #5a5a80; border-radius:6px;
    padding:4px 10px; font-size:12px;
    color:#c8c8d8; font-weight:700;
    display:flex; gap:6px; align-items:center;
  }

  #damagePanel {
    position:fixed; right:12px; top:90px;
    background:rgba(20,20,34,.88);
    border:1px solid #5a5a80; border-radius:10px;
    padding:10px 14px; z-index:8;
    color:#d8d8e8; font-size:12px;
    min-width:230px;
    pointer-events:none;
  }
  #damagePanel.hidden { display:none; }
  .dmg-head { font-size:13px; font-weight:700; color:#ffd76e; margin-bottom:8px; letter-spacing:1px; }
  .dmg-row { display:flex; justify-content:space-between; gap:10px; margin:3px 0; }
  .dmg-name { color:#a8a8c0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dmg-val { color:#ffd76e; font-weight:700; text-align:right; }
  .dmg-pct { color:#7ee08a; min-width:44px; text-align:right; font-weight:700; }
  .dmg-total { border-top:1px solid #3a3a55; margin-top:6px; padding-top:6px; font-weight:700; }

  #upgradePanel .upg-head { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  #upgradePanel .cards {
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
    max-width:1120px; padding:0 12px;
  }
  .upgrade-card {
    width:200px; padding:16px 12px;
    background:rgba(28,28,46,.95);
    border:2px solid #4a4a70; border-radius:12px;
    cursor:pointer; transition:.15s; text-align:center;
    position:relative;
  }
  .upgrade-card:hover { transform:translateY(-4px); }
  .upgrade-icon { font-size:30px; margin-bottom:5px; }
  .upgrade-name { font-weight:700; font-size:14px; margin-bottom:5px; color:#ffd76e; }
  .upgrade-desc { font-size:11px; color:#a8a8c0; line-height:1.45; }
  .upgrade-lv { font-size:10px; color:#7ee08a; margin-top:6px; font-weight:700; }
  .upgrade-tag {
    position:absolute; top:6px; right:6px;
    font-size:9px; padding:2px 6px; border-radius:8px;
    background:rgba(120,120,160,.4); color:#c8c8e0; letter-spacing:1px;
  }
  .upgrade-tag.weapon { background:rgba(120,200,255,.3); color:#a8e0ff; }
  .upgrade-tag.power { background:rgba(255,90,90,.35); color:#ffb0b0; }
  .upgrade-tag.speed { background:rgba(90,255,160,.3); color:#b0ffd0; }
  .upgrade-tag.exclusive { background:rgba(160,80,255,.35); color:#d0a0ff; }
  .upgrade-tag.global { background:rgba(255,215,110,.3); color:#ffd76e; }
  .upgrade-tag.new { background:rgba(120,255,255,.25); color:#a8ffff; }
  .upgrade-tag.meta { background:rgba(255,120,200,.3); color:#ffb0e0; }
  .upgrade-tag.orb { background:rgba(120,200,255,.35); color:#a8e0ff; }
  .upgrade-card.transcend {
    background:linear-gradient(180deg, rgba(60,35,80,.95), rgba(28,28,46,.95));
  }
  .upgrade-card.tier-mu { border-color:#a08060; box-shadow:0 0 8px rgba(160,120,80,.55), inset 0 0 8px rgba(160,120,80,.15); }
  .upgrade-card.tier-yin { border-color:#e8f0ff; box-shadow:0 0 14px rgba(200,220,255,.75), inset 0 0 10px rgba(200,220,255,.18); }
  .upgrade-card.tier-jin { border-color:#ffd76e; box-shadow:0 0 22px rgba(255,200,80,.85), inset 0 0 12px rgba(255,200,80,.20); }
  .upgrade-card.tier-cai {
    border-color:#ffffff;
    box-shadow:0 0 28px rgba(255,255,255,.85), 0 0 40px rgba(200,120,255,.7), inset 0 0 16px rgba(255,255,255,.25);
    animation: caiCardGlow 2.2s ease-in-out infinite;
  }
  .upgrade-card.tier-exclusive {
    border-color:#c878ff;
    box-shadow:0 0 16px rgba(200,120,255,.7), inset 0 0 10px rgba(200,120,255,.18);
  }
  @keyframes caiCardGlow {
    0%,100% { box-shadow:0 0 28px rgba(255,255,255,.85), 0 0 40px rgba(200,120,255,.7), inset 0 0 16px rgba(255,255,255,.25); }
    50% { box-shadow:0 0 34px rgba(255,255,255,.95), 0 0 56px rgba(200,120,255,.95), inset 0 0 20px rgba(255,255,255,.35); }
  }
  .mini-transcend-label {
    display:inline-block; font-size:8px; letter-spacing:1px;
    padding:1px 6px; border-radius:8px; margin-bottom:3px;
    background:linear-gradient(90deg,#a0d8ff,#c8a0ff);
    color:#1a1030; font-weight:700;
  }
  .refresh-btn {
    padding:8px 18px; border-radius:8px;
    background:rgba(40,40,64,.9);
    border:2px solid #5a5a80; color:#d8d8e8;
    font-size:13px; letter-spacing:1px; cursor:pointer;
    font-weight:700; transition:.15s;
    display:flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover:not(:disabled) { border-color:#ffd76e; color:#ffd76e; }
  .refresh-btn:disabled { opacity:.35; cursor:not-allowed; }
  .refresh-btn .rc { color:#7ee08a; font-weight:700; }
  .tier-badge {
    display:inline-block; font-size:10px; padding:1px 8px; border-radius:6px;
    margin-left:6px; font-weight:700; letter-spacing:1px;
  }
  .tier-badge.mu    { background:rgba(90,60,40,.6); color:#c8a080; }
  .tier-badge.yin   { background:rgba(180,190,210,.4); color:#e8ecf4; }
  .tier-badge.jin   { background:rgba(220,180,60,.4); color:#ffe8a0; }
  .tier-badge.cai   { background:linear-gradient(90deg,#ff5a8a,#ffd76e,#5aff9a,#5ad0ff,#c878ff); color:#1a1030; }
  #pausePanel h2 { font-size:28px; letter-spacing:3px; margin-bottom:14px; color:#ffd76e; }
  .hint { font-size:12px; color:#6a6a80; margin-top:18px; letter-spacing:1px; }
  .gold-display { font-size:15px; color:#ffd76e; margin-bottom:14px; font-weight:700; }
  #toast {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:rgba(20,20,34,.92); border:1px solid #ffb84d;
    color:#ffd76e; padding:8px 22px; border-radius:20px;
    font-size:14px; font-weight:600; z-index:20;
    opacity:0; transition:opacity .3s; pointer-events:none;
  }
  #toast.show { opacity:1; }
  #joystick {
    position:fixed; z-index:5; display:none;
    width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.06);
    border:2px solid rgba(255,255,255,.15);
    pointer-events:none;
  }
  #joystickKnob {
    position:absolute; width:50px; height:50px; border-radius:50%;
    background:rgba(255,215,110,.5);
    left:35px; top:35px; pointer-events:none;
  }
  body.touch #joystick { display:block; }
  #detailPanel {
    position:fixed; inset:0; z-index:15;
    display:none;
    background:rgba(6,6,14,0.92);
    backdrop-filter:blur(10px);
    color:#e0e0f0;
    overflow-y:auto;
  }
  #detailPanel.show { display:block; }
  .dp-wrap { max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
  .dp-head {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; padding-bottom:14px;
    border-bottom:1px solid #33334a;
  }
  .dp-title {
    font-size:24px; letter-spacing:4px; font-weight:700;
    background:linear-gradient(180deg,#ffd76e,#ff8a3d);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .dp-close {
    font-size:12px; color:#8a8aa0; letter-spacing:1px;
    padding:6px 14px; border:1px solid #3a3a55; border-radius:8px;
    cursor:pointer;
  }
  .dp-close:hover { border-color:#ffd76e; color:#ffd76e; }
  .dp-section { margin-bottom:26px; }
  .dp-section h3 {
    font-size:13px; letter-spacing:3px; color:#ffd76e;
    margin-bottom:12px; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .dp-section h3::after {
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg,#3a3a55,transparent);
  }
  .dp-grid {
    display:grid; gap:10px;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
  }
  .dp-item {
    background:rgba(24,24,40,.8);
    border:1px solid #2e2e44; border-radius:10px;
    padding:12px 14px;
  }
  .dp-item.highlight { border-color:#4a4a70; }
  .dp-item.transcended { border-color:#c878ff; box-shadow:0 0 18px rgba(200,120,255,.35); }
  .dp-item-top {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px;
  }
  .dp-item-name { font-size:14px; font-weight:700; color:#d8d8e8; }
  .dp-item-badge {
    font-size:10px; padding:2px 8px; border-radius:8px;
    background:rgba(120,200,255,.2); color:#a8e0ff; letter-spacing:1px;
  }
  .dp-item-badge.hero { background:rgba(255,160,60,.25); color:#ffd76e; }
  .dp-item-badge.global { background:rgba(255,215,110,.2); color:#ffd76e; }
  .dp-item-badge.orb { background:rgba(120,200,255,.3); color:#a8e0ff; }
  .dp-item-badge.transcend { background:linear-gradient(90deg,#d8a0ff,#ff8ad8); color:#2a1030; font-weight:700; }
  .dp-item-badge.mini { background:linear-gradient(90deg,#a0d8ff,#c8a0ff); color:#1a1030; font-weight:700; }
  .dp-bar-row { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:12px; }
  .dp-bar-label { width:56px; color:#8a8aa0; flex-shrink:0; font-size:11px; }
  .tier-track { flex:1; display:flex; gap:3px; }
  .tier-cell {
    flex:1; height:20px; border-radius:3px;
    background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.08);
    transition:.2s;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700;
    color:#ffffff;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
    position:relative;
  }
  .tier-cell.on.mu { background:linear-gradient(180deg,#9a7040,#5a3a20); border-color:#c8a080; box-shadow:0 0 6px rgba(160,120,80,.7); }
  .tier-cell.on.yin { background:linear-gradient(180deg,#f0f4ff,#a0a8b8); border-color:#ffffff; box-shadow:0 0 10px rgba(200,220,255,.85); color:#1a1a2a; text-shadow:none; }
  .tier-cell.on.jin { background:linear-gradient(180deg,#fff0a0,#c89010); border-color:#fff0c0; box-shadow:0 0 14px rgba(255,200,80,1); color:#3a2408; text-shadow:none; }
  .tier-cell.on.cai {
    background:linear-gradient(90deg,#ff5a8a,#ffd76e,#5aff9a,#5ad0ff,#c878ff);
    background-size:300% 100%;
    border-color:#ffffff;
    box-shadow:0 0 16px rgba(255,255,255,.9), 0 0 24px rgba(200,120,255,.8);
    animation: caiFlow 2s linear infinite;
    color:#1a1030; text-shadow:none;
  }
  .tier-cell.on.exclusive {
    background:linear-gradient(180deg,#d8a0ff,#a855f7);
    border-color:#e0c0ff;
    box-shadow:0 0 10px rgba(200,120,255,.85);
    color:#2a1030;
    text-shadow:none;
  }
  .tier-cell.mini::after {
    content:'✓'; position:absolute; right:1px; top:-1px;
    font-size:9px; color:#a0d8ff; text-shadow:0 0 4px #a0d8ff;
  }
  @keyframes caiFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .dp-bar-val { width:70px; text-align:right; flex-shrink:0; font-weight:700; font-size:11px; }
  .dp-bar-val.power { color:#ff8a6a; }
  .dp-bar-val.speed { color:#7ee08a; }
  .dp-bar-val.exclusive { color:#d8a0ff; }
  .dp-bar-val.global { color:#ffd76e; }
  .dp-bar-val.orb { color:#a8e0ff; }
  .dp-note { font-size:11px; color:#6a6a80; margin-top:6px; line-height:1.5; }
  .transcend-note {
    color:#d8a0ff; font-weight:700;
    background:rgba(200,120,255,.12);
    padding:4px 8px; border-radius:6px;
    display:inline-block; margin-top:6px;
  }
  .overflow-note {
    color:#ffb84d; font-weight:700;
    background:rgba(255,184,77,.12);
    padding:2px 6px; border-radius:4px;
    display:inline-block; margin-top:3px; font-size:10px;
  }
  #hintBar {
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    font-size:11px; color:#5a5a70; letter-spacing:1px;
    z-index:6; pointer-events:none;
  }
  #hintBar kbd {
    background:rgba(255,255,255,.08); padding:1px 6px;
    border-radius:4px; color:#9a9ab0; font-family:inherit;
  }
  #transcendBanner {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:18; pointer-events:none;
    text-align:center; opacity:0; transition:opacity .4s;
  }
  #transcendBanner.show { opacity:1; }
  #transcendBanner .tb-title {
    font-size:40px; font-weight:700; letter-spacing:8px;
    background:linear-gradient(90deg,#d8a0ff,#ff8ad8,#ffd76e);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(200,120,255,.6);
  }
  #transcendBanner .tb-sub { font-size:14px; color:#e0c0ff; letter-spacing:4px; margin-top:6px; }
  #waveBanner {
    position:fixed; top:28%; left:50%; transform:translateX(-50%);
    z-index:17; pointer-events:none;
    text-align:center; opacity:0; transition:opacity .3s;
  }
  #waveBanner.show { opacity:1; }
  #waveBanner .wb-title {
    font-size:28px; font-weight:700; letter-spacing:4px;
    color:#ffd76e;
    text-shadow:0 0 20px rgba(255,180,80,.7), 0 2px 6px rgba(0,0,0,.8);
  }
  #waveBanner .wb-title.big {
    font-size:44px; color:#ff8a3d; letter-spacing:8px;
    text-shadow:0 0 30px rgba(255,120,40,.95), 0 0 60px rgba(255,60,60,.6), 0 2px 8px rgba(0,0,0,.9);
  }
  #waveBanner .wb-title.boss {
    font-size:52px; color:#ff3a5a; letter-spacing:10px;
    text-shadow:0 0 40px rgba(255,60,90,1), 0 0 80px rgba(255,0,60,.7), 0 2px 10px rgba(0,0,0,.95);

if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if (w < 2*r) r = w/2;
    if (h < 2*r) r = h/2;
    this.beginPath();
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

    AC = new (window.AudioContext || window.webkitAudioContext)();

}
function setMasterGain(){

var sfxThrottle = {};
function canPlay(key, ms){
  var now = performance.now();
  if (sfxThrottle[key] && now - sfxThrottle[key] < ms) return false;
  sfxThrottle[key] = now;
  return true;
}
function makeNoiseBuffer(duration){
  var size = Math.max(1, Math.floor(AC.sampleRate * duration));
  var buffer = AC.createBuffer(1, size, AC.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i=0;i<size;i++) data[i] = Math.random()*2 - 1;
  return buffer;
}
function playTone(freq, dur, type, vol, freqEnd){
  if (!AC || !sfxEnabled || masterVolume <= 0) return;
  var t = AC.currentTime;
  var osc = AC.createOscillator();
  var g = AC.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), t + dur);
  g.gain.setValueAtTime(vol || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function playToneAt(freq, dur, type, vol, atTime){

  g.gain.linearRampToValueAtTime(vol || 0.15, atTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, atTime + dur);

  var total = w0 + w1 + w2 + w3;
  var r = Math.random() * total;
  if (r < w0){ caiPity++; return 0; }
  r -= w0;
  if (r < w1){ caiPity++; return 1; }
  r -= w1;
  if (r < w2){ caiPity++; return 2; }
  caiPity = 0;
  return 3;
}
function sumTierCounts(base, counts){
  var s = 0;
  for (var t=0;t<4;t++){
    var n = counts[t] || 0;
    if (n > 0) s += tierValue(base, t) * n;
  }
  return s;
}

var state = 'menu';
var game = null;
var keys = {};
var joystick = { active:false, dx:0, dy:0 };
var mouseScreen = { x: 0, y: 0, inited: false };

window.addEventListener('keydown', function(e){
  initAudio();
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
  if (e.key === 'Tab'){
    e.preventDefault();
    if (state === 'playing' || state === 'paused') toggleDetail();
  }
  if (e.key === 'Escape'){
    if (document.getElementById('detailPanel').classList.contains('show')) closeDetail();
    else if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
  if (e.key === 'r' || e.key === 'R'){
    if (state === 'upgrade') doRefresh();
  }
  if (e.key.toLowerCase() === 'e'){
    if (state === 'playing' || state === 'paused') toggleDamagePanel();
  }
  if (state === 'playing'){
    var n = parseInt(e.key);
    if (n >= 1 && n <= 8) useItem(n-1);
  }
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });
window.addEventListener('pointerdown', function(){ initAudio(); });
document.addEventListener('mousemove', function(e){
  mouseScreen.x = e.clientX;
  mouseScreen.y = e.clientY;
  if (!mouseScreen.inited) mouseScreen.inited = true;
});

var zoomLevel = 1.0;
var ZOOM_MIN = 0.55, ZOOM_MAX = 1.6;
var zoomIndicatorTimer = null;
window.addEventListener('wheel', function(e){
  if (document.getElementById('detailPanel').classList.contains('show')) return;
  if (state !== 'playing' && state !== 'paused') return;
  e.preventDefault();
  var delta = e.deltaY > 0 ? -0.08 : 0.08;
  zoomLevel = clamp(zoomLevel + delta, ZOOM_MIN, ZOOM_MAX);
  showZoomIndicator();
}, {passive:false});

function showZoomIndicator(){
  var el = document.getElementById('zoomIndicator');
  document.getElementById('zoomVal').textContent = zoomLevel.toFixed(2)+'x';
  el.classList.add('show');
  clearTimeout(zoomIndicatorTimer);
  zoomIndicatorTimer = setTimeout(function(){ el.classList.remove('show'); }, 1200);
}

var joyEl = document.getElementById('joystick');
var knobEl = document.getElementById('joystickKnob');
var joyId = null, joyStart = {x:0,y:0};
document.addEventListener('touchstart', function(e){
  if (state !== 'playing') return;
  if (controlMode === 'mouse') return;
  var t = e.changedTouches[0];
  if (t.clientX < W*0.5){
    joyId = t.identifier;
    joyStart = {x:t.clientX, y:t.clientY};
    joyEl.style.left = (t.clientX-60)+'px';
    joyEl.style.top  = (t.clientY-60)+'px';
    joystick.active = true;
    knobEl.style.left = '35px'; knobEl.style.top = '35px';
  }
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if (joyId === null) return;
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.identifier === joyId){
      var dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y;
      var len = Math.sqrt(dx*dx + dy*dy), max = 55;
      if (len > max){ dx = dx/len*max; dy = dy/len*max; }
      knobEl.style.left = (35+dx)+'px';
      knobEl.style.top  = (35+dy)+'px';
      var nl = Math.sqrt(dx*dx + dy*dy);
      joystick.dx = nl>5 ? dx/max : 0;
      joystick.dy = nl>5 ? dy/max : 0;
    }
  }
}, {passive:true});
document.addEventListener('touchend', function(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (t.identifier === joyId){ joyId = null; joystick.active = false; joystick.dx = joystick.dy = 0; }
  }
}, {passive:true});
if ('ontouchstart' in window) document.body.classList.add('touch');

var cam = { x:0, y:0 };
function worldToScreen(x,y){
  return { x: (x - cam.x) * zoomLevel + W/2, y: (y - cam.y) * zoomLevel + H/2 };
}

Player.prototype.rollCrit = function(extra){
  var chance = this.critChance + (extra || 0) + this.critPity * CRIT_PITY_STEP;
  if (chance > 1) chance = 1;
  var isCrit = Math.random() < chance;
  if (isCrit) this.critPity = 0;
  else this.critPity++;
  return isCrit;
};
Player.prototype.initWeaponMod = function(wid){
  if (!this.weaponMods[wid]){
    this.weaponMods[wid] = {
      powerCounts: emptyTierCounts(), speedCounts: emptyTierCounts(),
      exclusiveCounts: [0,0,0,0], miniTranscended: [false,false,false,false],
      runtime: {}, greatTranscend: false
    };
  }
};
Player.prototype.getAllWeaponIds = function(){
  var ids = [this.heroWeapon];
  for (var k in this.universalWeapons) ids.push(k);
  return ids;
};
Player.prototype.getWeaponLevel = function(wid){
  return wid === this.heroWeapon ? 1 : (this.universalWeapons[wid] || 0);
};
Player.prototype.hasTranscended = function(wid){
  var mod = this.weaponMods[wid];
  if (!mod) return false;
  return !!mod.greatTranscend;
};
Player.prototype.countMiniTranscended = function(wid){
  var mod = this.weaponMods[wid];
  if (!mod) return 0;
  var c = 0;
  for (var i=0;i<4;i++) if (mod.miniTranscended[i]) c++;
  return c;
};
Player.prototype.getTotalAttack = function(){
  var total = 0;
  var wids = this.getAllWeaponIds();
  for (var i = 0; i < wids.length; i++){
    var st = this.getWeaponStats(wids[i]);
    if (st) total += st.dmg;
  }
  return total;
};
Player.prototype.getOrbRespawnTime = function(){
  if (this.orbitLevel === 0) return 999;
  var globalSpeedBonus = sumTierCounts(BASE_GLOBAL_SPEED, this.globalSpeedCounts);
  var orbSpeedBonus = sumTierCounts(ORB_SPEED_BASE, this.orbSpeedCounts);
  var totalSpeed = (1 + globalSpeedBonus) * (1 + orbSpeedBonus);
  var t = ORB_BASE_RESPAWN / totalSpeed;
  return Math.max(0.6, t);
};

Player.prototype.getWeaponStats = function(wid){
  var w = WEAPONS[wid];
  if (!w) return null;
  var lv = this.getWeaponLevel(wid);
  if (lv === 0) return null;
  var mod = this.weaponMods[wid];
  if (!mod){ this.initWeaponMod(wid); mod = this.weaponMods[wid]; }
  var rt = mod.runtime || {};

  var baseDmg = w.damage * (1 + (lv-1)*0.30);
  var baseAtkInterval = w.atkSpeed * Math.pow(0.90, lv-1);

  var indPowerBonus = sumTierCounts(BASE_IND_POWER, mod.powerCounts);
  var indSpeedBonus = sumTierCounts(BASE_IND_SPEED, mod.speedCounts);
  var gloPowerBonus = sumTierCounts(BASE_GLOBAL_POWER, this.globalPowerCounts);
  var gloSpeedBonus = sumTierCounts(BASE_GLOBAL_SPEED, this.globalSpeedCounts);
  if (this.gravityBuffTimer > 0){
    gloPowerBonus += this.gravityPowBuff;
    gloSpeedBonus += this.gravitySpdBuff;
  }

  var hasteMult = this.hasteTimer > 0 ? (rt._killHasteMult || 1.5) : 1;
  hasteMult *= (1 + this.hasteBuff);

  var rawSpeedMult = (1 + indSpeedBonus) * (1 + gloSpeedBonus) * hasteMult;

  var overflowAmount = 0, overflowDmgMult = 1, overflowKbMult = 1;
  var totalSpeedMult = rawSpeedMult;
  if (w.speedCap != null){
    var capMult = 1 + w.speedCap;
    if (rawSpeedMult > capMult){
      overflowAmount = rawSpeedMult - capMult;
      overflowDmgMult = 1 + overflowAmount * OVERFLOW_DMG_PER_UNIT;
      overflowKbMult = 1 + overflowAmount * OVERFLOW_KB_PER_UNIT;
      totalSpeedMult = capMult;
    }
  } else {
    var atkIntervalRaw = baseAtkInterval / rawSpeedMult;
    if (atkIntervalRaw < ATK_INTERVAL_FLOOR){
      var capMult2 = baseAtkInterval / ATK_INTERVAL_FLOOR;
      overflowAmount = rawSpeedMult - capMult2;
      overflowDmgMult = 1 + overflowAmount * OVERFLOW_DMG_PER_UNIT;
      overflowKbMult = 1 + overflowAmount * OVERFLOW_KB_PER_UNIT;
      totalSpeedMult = capMult2;
    }
  }

  var dmgMult = (1 + indPowerBonus) * (1 + gloPowerBonus);
  if (w.noPower) dmgMult = 1;
  else if (w.wtype === 'control') dmgMult = (1 + indPowerBonus*0.3) * (1 + gloPowerBonus*0.3);
  else if (w.wtype === 'utility') dmgMult = (1 + indPowerBonus*0.5) * (1 + gloPowerBonus*0.5);
  dmgMult *= overflowDmgMult;
  dmgMult *= (1 + this.powerBuff);

  var dmg = baseDmg * dmgMult;

  if (w.kind === 'flame' && rt._dmgBonus) dmg += rt._dmgBonus;
  if (w.kind === 'firewhirl' && rt._whirlDmg) dmg += rt._whirlDmg;
  if (w.kind === 'gravity' && rt._gravDmg) dmg += rt._gravDmg;
  if (rt._shatterDmgBonus) dmg += rt._shatterDmgBonus;
  if (rt._trackDmgBonus) dmg += rt._trackDmgBonus;
  if (rt._vortexDmgAdd) dmg += rt._vortexDmgAdd;
  if (rt._knifeDmgBonus) dmg += rt._knifeDmgBonus;
  if (rt._fireDmgBonus) dmg += rt._fireDmgBonus;
  if (rt._shardDmgBonus) dmg += rt._shardDmgBonus;
  if (rt._novaDmgAdd) dmg += rt._novaDmgAdd;
  if (rt._boltDmgBonus) dmg += rt._boltDmgBonus;
  if (this.warlordDmgLevel > 0 && (wid === 'hero_melee_warlord' || wid === 'hero_arrow_warlord')){
    dmg += this.warlordDmgLevel * this.warlordDmgPerLevel;
  }

  var atkInterval = baseAtkInterval / totalSpeedMult;
  if (w.speedCap == null && atkInterval < ATK_INTERVAL_FLOOR) atkInterval = ATK_INTERVAL_FLOOR;

  var range = w.range * (1 + (rt._rangeBonus || 0));
  if (w.kind === 'gravity' && rt._transcend === 'singularity') range *= 1.15;

  var slowPower = 0, slowDur = 0, stunDur = 0, burnDps = 0, burnDur = 0;
  var healPct = 0, overflowPct = 0, buffDur = 0, gravBuffCap = 0.40;
  var flameLength = 0, flameWidth = 0, burnMaxStacks = 0;
  if (w.kind === 'frost'){
    slowPower = (w.slowBase || 0.35) + (rt._slowBonus || 0);
    slowDur = (w.slowDurBase || 1.4) + (rt._slowDurBonus || 0);
  }
  if (w.kind === 'lightning') stunDur = (w.stunBase || 0.35) + (rt._stunBonus || 0);
  if (w.kind === 'flame'){
    burnDps = (w.burnBase || 2) * (1 + (indPowerBonus + gloPowerBonus)*0.5);
    burnDur = 3;
    burnMaxStacks = (rt._burnStacksBonus || 0) + 1;
    if (rt._transcend === 'fireTornado'){
      flameLength = (w.flameLength || 220) + (rt._lengthBonus || 0) + 80 + (rt._fireTornadoLen || 0);
      flameWidth = (w.flameWidth || 26) + 18;
    } else {
      flameLength = (w.flameLength || 220) + (rt._lengthBonus || 0);
      flameWidth = (w.flameWidth || 26);
    }
  }
  if (w.kind === 'firewhirl'){
    burnDps = (w.burnBase || 1.2) * (1 + (indPowerBonus + gloPowerBonus)*0.5);
    burnDur = (w.burnDur || 2.5) + (rt._burnDurBonus || 0);
    burnMaxStacks = (rt._burnStacksBonus || 0) + 1;
  }
  if (w.kind === 'gravity'){
    healPct = (w.healPct || 0.15) + (rt._healBonus || 0);
    overflowPct = (w.overflowPct || 0.12) + (rt._overflowBonus || 0);
    buffDur = (w.buffDur || 3.0) + (rt._buffDurBonus || 0);
    gravBuffCap = 0.40 + (rt._gravBuffCap || 0);
    if (rt._transcend === 'singularity'){
      healPct += 0.05;
      overflowPct += 0.05;
      buffDur += 2.0;
    }
  }

  var finalKnockback = w.knockback * overflowKbMult;

  return {
    w:w, lv:lv, mod:mod, dmg:dmg, atkInterval:atkInterval, range:range,
    knockback: finalKnockback,
    indPowerBonus:indPowerBonus, indSpeedBonus:indSpeedBonus,
    gloPowerBonus:gloPowerBonus, gloSpeedBonus:gloSpeedBonus,
    hasteMult:hasteMult,
    slowPower:slowPower, slowDur:slowDur, stunDur:stunDur,
    burnDps:burnDps, burnDur:burnDur, burnMaxStacks:burnMaxStacks,
    flameLength:flameLength, flameWidth:flameWidth,
    healPct:healPct, overflowPct:overflowPct, buffDur:buffDur, gravBuffCap:gravBuffCap,
    overflowAmount:overflowAmount, overflowDmgMult:overflowDmgMult, overflowKbMult:overflowKbMult
  };
};

function selectTargets(g, w, count, range, preferUnCC){
  var p = g.player;
  var enemies = g.enemies;
  var candidates = [];
  var px = p.x, py = p.y;
  for (var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if (e.dead) continue;
    var rLim = range + e.radius;
    var dsq = distSq(px, py, e.x, e.y);
    if (dsq <= rLim*rLim){
      candidates.push({ e:e, d: dsq, cc: (e.slowTimer > 0 || e.freezeTimer > 0 || e.stunTimer > 0) ? 1 : 0 });
    }
  }
  if (candidates.length === 0) return [];
  candidates.sort(function(a,b){
    if (preferUnCC && a.cc !== b.cc) return a.cc - b.cc;
    return a.d - b.d;
  });
  var result = [];
  var claimed = g.claimedTargets || {};
  for (var j=0;j<candidates.length && result.length<count;j++){
    var c = candidates[j];
    if (claimed[c.e.id]) continue;
    result.push(c.e);
  }
  if (result.length < count){
    for (var k=0;k<candidates.length && result.length<count;k++){
      var c2 = candidates[k];
      if (result.indexOf(c2.e) >= 0) continue;
      result.push(c2.e);
    }
  }
  return result;
}

function getWaveInterval(){
  return 15;
}
function getWaveBudget(waveNum){
  return 8 * (1 + waveNum * 0.6 + waveNum * waveNum * 0.05);
}
function getEnemyProb(typeKey, waveNum){
  var t = ENEMY_TYPES[typeKey];
  var p = t.baseProb + t.probPerWave * (waveNum - t.unlockWave);
  return clamp(p, t.probMin, t.probMax);
}
function rollEnemyType(waveNum){
  var total = 0;
  var probs = {};
  for (var key in ENEMY_TYPES){
    var t = ENEMY_TYPES[key];
    if (waveNum < t.unlockWave) continue;
    var p = getEnemyProb(key, waveNum);
    if (p <= 0) continue;
    probs[key] = p; total += p;
  }
  if (total <= 0) return 'slime';
  var r = Math.random() * total;
  for (var key2 in probs){
    r -= probs[key2];
    if (r <= 0) return key2;
  }
  return 'slime';
}

// ============================================================
function getHpScale(wave){
  var scale = 5.7;
  var segs = [
    { end: 10,  rate: 1.36, start: 1 },
    { end: 25,  rate: 1.30, start: 11 },
    { end: 50,  rate: 1.22, start: 26 },
    { end: 100, rate: 1.11, start: 51 },
    { end: 200, rate: 1.04, start: 101 },
    { end: 300, rate: 1.02, start: 201 },
    { end: 500, rate: 1.01, start: 301 }
  ];
  var cursor = 1;
  for (var i=0; i<segs.length; i++){
    var s = segs[i];
    if (wave >= cursor){
      var endWave = Math.min(wave, s.end);
      var steps = endWave - cursor + 1;
      if (i === 0) steps = Math.max(0, endWave - 1);
      scale *= Math.pow(s.rate, steps);
      cursor = s.end + 1;
      if (wave <= s.end) break;
    }
  }
  return scale;
}
function getDmgScale(waveNum){ return 1 + waveNum * 0.12; }

function spawnEnemyAt(g, typeKey, x, y){
  var t = ENEMY_TYPES[typeKey];
  if (!t) return null;
  var waveNum = g.wave;
  var hpScale = getHpScale(waveNum);
  var dmgScale = getDmgScale(waveNum);
  var e = {
    id: ++enemyIdCounter, type: typeKey, name: t.name, icon: t.icon,
    x: x, y: y,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    dmg: t.dmg * dmgScale,
    speed: t.speed, radius: t.radius, mass: t.mass,
    xp: t.xp * (g.waveXpMult || 1), color: t.color,
    ai: t.ai, flying: !!t.flying,
    hitTimer: 0, wobble: Math.random()*Math.PI*2,
    kvx: 0, kvy: 0,
    slowTimer: 0, slowFactor: 1,
    freezeTimer: 0, stunTimer: 0,
    burnStacks: 0, burnTimer: 0, burnDps: 0,
    frostStacks: 0,
    atkRange: t.attackRange || 0, atkInterval: t.attackInterval || 0,
    atkTimer: t.attackInterval ? Math.random()*t.attackInterval : 0,
    projSpeed: t.projectileSpeed || 0, projRadius: t.projectileRadius || 0,
    homing: !!t.homing, splitOnDeath: t.splitOnDeath || 0,
    isBoss: false
  };
  g.enemies.push(e);
  return e;
}

function spawnBossAt(g, bossDef, x, y){
  var waveNum = g.wave;
  var baseHpScale = getHpScale(waveNum);
  var baseDmgScale = getDmgScale(waveNum);
  var baseEnemy = ENEMY_TYPES.brute;
  var boss = {
    id: ++enemyIdCounter,
    type: 'boss_' + bossDef.key,
    name: bossDef.name, icon: bossDef.icon,
    x: x, y: y,
    hp: baseEnemy.hp * baseHpScale * bossDef.hpMult,
    maxHp: baseEnemy.hp * baseHpScale * bossDef.hpMult,
    dmg: baseEnemy.dmg * baseDmgScale * bossDef.dmgMult,
    speed: baseEnemy.speed * bossDef.speedMult,
    radius: baseEnemy.radius * bossDef.radiusMult,
    mass: baseEnemy.mass * bossDef.radiusMult,
    xp: 30 * (g.waveXpMult || 1), color: bossDef.color,
    ai: bossDef.rangedAI ? 'ranged' : 'chase',
    flying: false,
    hitTimer: 0, wobble: Math.random()*Math.PI*2,
    kvx: 0, kvy: 0,
    slowTimer: 0, slowFactor: 1,
    freezeTimer: 0, stunTimer: 0,
    burnStacks: 0, burnTimer: 0, burnDps: 0,
    frostStacks: 0,
    atkRange: bossDef.attackRange || 0, atkInterval: bossDef.attackInterval || 0,
    atkTimer: bossDef.attackInterval ? Math.random()*bossDef.attackInterval : 0,
    projSpeed: bossDef.projectileSpeed || 0, projRadius: bossDef.projectileRadius || 0,
    homing: !!bossDef.homing,
    tripleShot: !!bossDef.tripleShot,
    splitOnDeath: bossDef.splitOnDeath || 0,
    knockbackResist: bossDef.knockbackResist || 0,
    bleedOnHit: !!bossDef.bleedOnHit,
    chargeDash: !!bossDef.chargeDash,
    summonMinions: !!bossDef.summonMinions,
    summonTimer: 4.0,
    selfHeal: !!bossDef.selfHeal,
    healTimer: 3.0,
    dashTimer: 3.0, dashActive: 0,
    isBoss: true, bossKey: bossDef.key, bossDesc: bossDef.desc
  };
  g.enemies.push(boss);
  return boss;
}

function startWave(g){
  g.wave += 1;
  var isBossWave = (g.wave % 20 === 0);
  var isStageWave = (g.wave % 10 === 0);
  g.waveActive = true;
  g.waveBudgetRemaining = getWaveBudget(g.wave);
  g.waveSpawnQueue = [];
  g.waveSpawnTimer = 0;
  if (g.enemies.length > 300) g.waveBudgetRemaining *= 0.5;
  if (g.enemies.length > 500) g.waveBudgetRemaining = 0;
  g.currentWaveTotalHp = 0;
  g.currentWaveSpawnedCount = 0;
  g.currentWaveSpawnedHp = 0;
  g.currentWaveEnemyIds = {};

  var safety = 2000;
  while (g.waveBudgetRemaining > 0 && safety-- > 0){
    var typeKey = rollEnemyType(g.wave);
    var t = ENEMY_TYPES[typeKey];
    if (!t) break;
    if (t.cost > g.waveBudgetRemaining && g.waveSpawnQueue.length > 0) break;
    var count = t.group || 1;
    var cost = t.cost * count;
    if (cost > g.waveBudgetRemaining && g.waveSpawnQueue.length > 0) break;
    for (var i=0;i<count;i++) g.waveSpawnQueue.push(typeKey);
    g.waveBudgetRemaining -= cost;
  }

  var totalBaseXp = 0;
  for (var qIdx = 0; qIdx < g.waveSpawnQueue.length; qIdx++){
    var qType = ENEMY_TYPES[g.waveSpawnQueue[qIdx]];
    if (qType) totalBaseXp += qType.xp;
  }
  var pRef = g.player;
  var targetXp = Math.max(0, g.xpNext - g.xp)
               + xpForLevel(pRef.level + 1);
  g.waveXpMult = totalBaseXp > 0 ? (targetXp / totalBaseXp) : 1;

  if (isBossWave){
    g.bossWaveIndex++;
    var bossAngle = Math.random()*Math.PI*2;
    var bossSpawnR = Math.max(W,H)*0.62 + 60;
    var bossSx = g.player.x + Math.cos(bossAngle)*bossSpawnR;
    var bossSy = g.player.y + Math.sin(bossAngle)*bossSpawnR;
    var typeIdx = (g.bossWaveIndex - 1) % BOSS_TYPE_ORDER.length;
    var typeKeyB = BOSS_TYPE_ORDER[typeIdx];
    var bossList = BOSS_TYPES[typeKeyB];
    var bossDef = pick(bossList);
    var spawnedBoss = spawnBossAt(g, bossDef, bossSx, bossSy);
    if (spawnedBoss){
      g.currentWaveEnemyIds[spawnedBoss.id] = true;
      g.currentWaveSpawnedCount += 1;
      g.currentWaveSpawnedHp += spawnedBoss.maxHp;
      g.currentWaveTotalHp += spawnedBoss.maxHp;
    }
    showWaveBanner('👑 BOSS 来袭 · ' + bossDef.name, true);
    g.screenShake = 16;
    SFX.boss();
  } else if (isStageWave){
    var stage = Math.floor(g.wave / 10);
    showWaveBanner('⚠️ 第 '+g.wave+' 波 · 第 '+stage+' 阶段', true);
    g.screenShake = 12;
    SFX.wave();
  } else {
    showWaveBanner('第 '+g.wave+' 波', false);
    SFX.wave();
  }
}

function showWaveBanner(text, big){
  var el = document.getElementById('waveBanner');
  var title = document.getElementById('wbTitle');
  title.textContent = text;
  title.classList.remove('big');
  title.classList.remove('boss');
  if (text.indexOf('BOSS') >= 0) title.classList.add('boss');
  else if (big) title.classList.add('big');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){
    el.classList.remove('show');
  }, text.indexOf('BOSS') >= 0 ? 3000 : (big ? 2500 : 1500));
}

function xpForLevel(lv){ return Math.floor(5 + lv*3.2 + Math.pow(lv,1.6)*0.9); }

function useItem(index){
  if (!game || state !== 'playing') return;
  var def = ITEM_DEFS[index];
  if (!def) return;
  var p = game.player;
  if (!p.items[def.key] || p.items[def.key] <= 0){
    toast('❌ 没有 ' + def.name);
    return;
  }
  p.items[def.key]--;
  save.items[def.key] = p.items[def.key];
  persist();
  SFX.item();

  if (def.key === 'potion'){
    var heal = p.maxHp * 0.5;
    p.hp = Math.min(p.maxHp, p.hp + heal);
    toast('🧪 回复 ' + Math.round(heal) + ' HP');
  }
  else if (def.key === 'haste'){
    p.hasteBuff += 0.5;
    p.hasteBuffTimer = 10;
    toast('⚡ 攻速 +50%（总 +' + Math.round(p.hasteBuff*100) + '%）');
  }
  else if (def.key === 'power'){
    p.powerBuff += 0.5;
    p.powerBuffTimer = 10;
    toast('💥 伤害 +50%（总 +' + Math.round(p.powerBuff*100) + '%）');
  }
  else if (def.key === 'shield'){
    p.invuln = Math.max(p.invuln, 3.0);
    toast('🛡️ 无敌 3 秒');
  }
  else if (def.key === 'magnet'){
    var count = 0;
    for (var j=0;j<game.gems.length;j++){
      var gem2 = game.gems[j];
      if (gem2.life > 0){
        game.xp += gem2.value;
        gem2.life = 0;
        count++;
      }
    }
    game.gems = game.gems.filter(function(gm){ return gm.life > 0; });
    var chestCount = 0;
    for (var ci=0; ci<game.chests.length; ci++){
      var ch = game.chests[ci];
      if (!ch.opened){ ch.attracting = true; chestCount++; }
    }
    var msg = '💎 吸取 ' + count + ' 个经验宝石';
    if (chestCount > 0) msg += ' · 吸引 ' + chestCount + ' 个宝箱';
    toast(msg);
    checkLevelUp(game);
  }
  else if (def.key === 'freeze'){
    for (var k=0;k<game.enemies.length;k++){
      game.enemies[k].freezeTimer = Math.max(game.enemies[k].freezeTimer, 3.0);
    }
    toast('❄️ 全场冻结 3 秒');
  }
  else if (def.key === 'fireball'){
    var _fbPrev = game._dmgSource;
    game._dmgSource = '__fireball__';
    for (var m=0;m<game.enemies.length;m++){
      var en = game.enemies[m];
      if (en.dead) continue;
      var dmg = en.maxHp * 0.30;
      applyHit(game, en, dmg, 0, 0, false);
    }
    for (var fp=0;fp<30;fp++){
      var fa = Math.random()*Math.PI*2;
      var fr = rand(50, 200);
      game.particles.push({
        type:'spark',
        x: p.x + Math.cos(fa)*fr,
        y: p.y + Math.sin(fa)*fr,
        vx: Math.cos(fa)*rand(50,200),
        vy: Math.sin(fa)*rand(50,200),
        life: rand(0.4,0.9), maxLife:0.9,
        color: pick(['#ff5a2a','#ff8a3d','#ffd76e'])
      });
    }
    game._dmgSource = _fbPrev;
    toast('🔥 全场火球！');
  }
  else if (def.key === 'lucky'){
    game.chests.push({
      x: p.x + rand(-40,40),
      y: p.y + rand(-40,40),
      radius: 16, bob: 0, opened: false
    });
    toast('💰 获得 1 个宝箱');
  }
  updateItemBar();
}

function weaponAttack(g, wid){
  g._dmgSource = wid;
  var p = g.player;
  var stats = p.getWeaponStats(wid);
  if (!stats) return;
  var w = stats.w;
  var mod = stats.mod;
  var rt = (mod && mod.runtime) ? mod.runtime : {};
  var preferUnCC = (w.wtype === 'control');

  if (w.kind === 'melee'){
    var isWarlordMelee = (wid === 'hero_melee_warlord');
    var sweepAngle = isWarlordMelee ? (rt._wlSweepWide ? Math.PI*1.22 : Math.PI) : 0.7;
    var sweepRange = stats.range;
    if (isWarlordMelee && rt._wlSweepRange) sweepRange *= (1 + rt._wlSweepRange);
    var shots = 1 + p.extraShots;
    var multiHit = rt._multiHit || 0;
    var totalShots = shots + multiHit;
    var targets = selectTargets(g, w, totalShots, sweepRange, false);
    if (targets.length === 0) return;
    SFX.slash();

    var baseAng = Math.atan2(targets[0].y-p.y, targets[0].x-p.x);
    for (var s=0; s<totalShots; s++){
      var tgt = targets[s % targets.length];
      var ang = Math.atan2(tgt.y-p.y, tgt.x-p.x);
      g.claimedTargets[tgt.id] = true;
      for (var j=0;j<g.enemies.length;j++){
        var e = g.enemies[j];
        if (e.dead) continue;
        var rLim = sweepRange + e.radius;
        if (distSq(p.x, p.y, e.x, e.y) > rLim*rLim) continue;
        var ea = Math.atan2(e.y-p.y, e.x-p.x);
        var diff = Math.abs(ea - ang);
        if (diff > Math.PI) diff = Math.PI*2 - diff;
        var threshold = isWarlordMelee ? sweepAngle : 0.7;
        if (diff < threshold){
          var crit = p.rollCrit(rt._critBonus||0);
          var dealt = crit ? stats.dmg*4 : stats.dmg;
          applyHit(g, e, dealt, stats.knockback, ang, crit);
          if (isWarlordMelee && rt._wlStun > 0) e.stunTimer = Math.max(e.stunTimer, rt._wlStun);
          if (rt._bonusAoE){
            for (var k2=0;k2<g.enemies.length;k2++){
              var e2 = g.enemies[k2];
              if (e2 === e || e2.dead) continue;

function applyHit(g, e, dmg, knockback, dirAngle, isCrit, src){
  if (e.dead) return;
  var finalDmg = dmg;
  var crit;
  if (isCrit === undefined){
    crit = g.player.rollCrit();
    if (crit) finalDmg *= 4;
  } else {
    crit = isCrit;
  }

  var dmgSrc = src || g._dmgSource || 'other';

  var p = g.player;
  var isWarlordWeapon = (dmgSrc === 'hero_melee_warlord' || dmgSrc === 'hero_arrow_warlord');
  if (isWarlordWeapon){
    var mod = p.weaponMods['hero_melee_warlord'];
    var rt = mod && mod.runtime ? mod.runtime : {};
    var devourRate = rt._wlDevour || 0;
    var minDmgPct = rt._wlMinDmg || 0;
    if (e.isBoss) minDmgPct *= 2;
    var hpThreshold = e.maxHp || (e.hp + finalDmg);
    var hpPct = e.hp / Math.max(1, hpThreshold);
    if (hpPct < 0.5 && !e.isBoss && devourRate > 0 && Math.random() < devourRate){
      finalDmg = e.hp + 99999;
    }
    if (minDmgPct > 0 && !(e.isBoss && devourRate > 0 && Math.random() < devourRate)){
      var minDmg = hpThreshold * minDmgPct;
      if (finalDmg < minDmg) finalDmg = minDmg;
    }
  }

  e.hp -= finalDmg;
  e.hitTimer = 0.08;

  g.damageStats[dmgSrc] = (g.damageStats[dmgSrc] || 0) + finalDmg;

  if (knockback > 0){
    var kb = knockback / e.mass;
    if (e.knockbackResist) kb *= (1 - e.knockbackResist);
    var kbSpeed = kb * 4;
    var kbLimit = e.isBoss ? kbLimitBoss : kbLimitNormal;
    if (kbSpeed > kbLimit) kbSpeed = kbLimit;
    e.kvx += Math.cos(dirAngle) * kbSpeed;
    e.kvy += Math.sin(dirAngle) * kbSpeed;
  }

  if (g.damageTexts.length >= 200) g.damageTexts.splice(0, 50);
  var displayText = Math.round(finalDmg);
  var displayColor = crit ? '#ff5a5a' : '#ffffff';
  g.damageTexts.push({
    x:e.x, y:e.y-e.radius-6, vy:-42,
    life:0.7, maxLife:0.7,
    text: displayText, crit:crit,
    color: displayColor
  });

  if (finalDmg >= 99999) SFX.transcend(); else if (crit) SFX.crit(); else SFX.hit();
  if (e.hp <= 0) killEnemy(g, e, dirAngle);
}

function killEnemy(g, e, dirAngle){
  if (e.dead) return;
  e.dead = true;
  g.kills++;
  g.goldEarned += 1;
  SFX.death();

  var p = g.player;
  var heroKey = p.heroKey;
  if (heroKey !== 'warlord' && !save.fragments[heroKey]){
    if (Math.random() < g.wave / 100000){
      save.fragments[heroKey] = true;
      p.fragmentCollected = heroKey;
      persist();
      setTimeout(function(){ p.fragmentCollected = ''; }, 3000);
    }
  }

  if (e.isBoss){
    for (var b=0;b<3;b++){
      var a = Math.random()*Math.PI*2;
      var r = rand(30, 80);
      g.chests.push({ x:e.x + Math.cos(a)*r, y:e.y + Math.sin(a)*r, radius:16, bob:0, opened:false });
    }
    g.goldEarned += 50;
    toast('👑 击杀 ' + e.name + '！+50 金币 + 3 宝箱');
    g.screenShake = 14;
    for (var bp=0;bp<40;bp++){
      var ba = Math.random()*Math.PI*2;
      var bs = rand(100,400);
      g.particles.push({
        type:'spark', x:e.x, y:e.y,
        vx: Math.cos(ba)*bs, vy: Math.sin(ba)*bs,
        life: rand(0.5,1.2), maxLife:1.2,
        color: pick(['#ffd76e','#ff8a3d','#ff5a5a'])
      });
    }
  }

  if (e.burnExplode && e.burnStacks > 0){
    var r2 = 80;
    var r2sq = r2*r2;
    for (var i=0;i<g.enemies.length;i++){
      var e2 = g.enemies[i];
      if (e2 === e || e2.dead) continue;
      if (distSq(e2.x, e2.y, e.x, e.y) < r2sq){
        var beCrit = g.player.rollCrit();
        var beDmg = e.burnDps * 2 * (beCrit ? 4 : 1);
        applyHit(g, e2, beDmg, 30, Math.atan2(e2.y-e.y, e2.x-e.x), beCrit, e._burnSrc || 'hero_melee_warlock');
      }
    }
    g.novae.push({ x:e.x, y:e.y, radius:0, maxRadius:r2, life:0.4, maxLife:0.4, color:'#ff8a3d' });
  }

  // 毒尸爆炸
  if (e.toxinMarks > 0){
    var toxRt3 = p.weaponMods['uni_toxin'] && p.weaponMods['uni_toxin'].runtime;
    if (toxRt3 && toxRt3._toxExplode && toxRt3._toxDmg > 0){
      var toxBDmg = (WEAPONS.uni_toxin.damage + toxRt3._toxDmg) * e.toxinMarks;
      var toxBR = 60 + (toxRt3._circleR||0);
      var toxBRsq = toxBR * toxBR;
      g.novae.push({ x:e.x, y:e.y, radius:0, maxRadius:toxBR, life:0.4, maxLife:0.4, color:'#5aff5a' });
      for (var txi2=0;txi2<g.enemies.length;txi2++){
        var tx2 = g.enemies[txi2];
        if (tx2 === e || tx2.dead) continue;
        if (distSq(tx2.x, tx2.y, e.x, e.y) < toxBRsq){
          var txCrit = p.rollCrit();
          var txDmg = toxBDmg * (txCrit ? 4 : 1);
          applyHit(g, tx2, txDmg, 0, Math.atan2(tx2.y-e.y, tx2.x-e.x), txCrit, 'uni_toxin');
          var txCap = 1 + (toxRt3._markCap||0);
          tx2.toxinMarks = Math.min(txCap, (tx2.toxinMarks||0) + 1);
          tx2.toxinTickTimer = Math.min(3.0, tx2.toxinTickTimer||3.0);
          tx2.toxinSrc = 'uni_toxin';
        }
      }
    }
  }

  if (e.splitOnDeath > 0){
    for (var sp=0; sp<e.splitOnDeath; sp++){
      var a2 = (Math.PI*2/e.splitOnDeath)*sp + Math.random()*0.5;
      var ox = e.x + Math.cos(a2) * 30;
      var oy = e.y + Math.sin(a2) * 30;
      if (e.isBoss) spawnEnemyAt(g, 'brute', ox, oy);
      else spawnEnemyAt(g, 'wanderer', ox, oy);
    }
  }

  var p = g.player;
  var mod = p.weaponMods[p.heroWeapon];
  if (p.heroWeapon === 'hero_melee_rogue' && mod && mod.runtime._transcend === 'knifeBurst'){
    var knifeCount = 8 + (mod.runtime._knifeBurstCount || 0);
    for (var k=0;k<knifeCount;k++){
      var a3 = (Math.PI*2/knifeCount)*k;
      g.projectiles.push({
        x:e.x, y:e.y,
        vx: Math.cos(a3)*350, vy: Math.sin(a3)*350,
        radius:5, damage:12, knockback:10, pierce:2,
        hit:{}, life:0.6, color:'#ff6b8a', kind:'knife', src: 'hero_melee_rogue'
      });
    }
  }
  if (mod && mod.runtime._killHaste){ p.hasteTimer = 2.5; }

  g.gems.push({
    x:e.x, y:e.y, value:e.xp,
    vx: rand(-40,40), vy: rand(-40,40),
    radius: 5 + Math.min(e.xp,4), life: 22
  });
  for (var i3=0;i3<6;i3++){
    g.particles.push({
      type:'spark', x:e.x, y:e.y,
      vx: rand(-90,90), vy: rand(-90,90),
      life: rand(0.3,0.6), maxLife:0.6, color: e.color
    });
  }
  g.bloodDecals.push({ x:e.x, y:e.y, r:e.radius*rand(1,1.8), alpha:0.35 });
  if (g.bloodDecals.length > 120) g.bloodDecals.shift();
}

function tryOrbAbsorb(g, dmg){
  var p = g.player;
  if (!p.orbAlive) return false;
  var reducedDmg = dmg * p.armorMult;
  p.orbHp -= reducedDmg;
  p.invuln = Math.max(p.invuln, 0.5);
  g.particles.push({ type:'orbHit', x:p.x, y:p.y, life:0.25, maxLife:0.25 });
  if (p.orbHp <= 0){
    p.orbAlive = false;
    p.orbHp = 0;
    p.orbRespawnTimer = p.getOrbRespawnTime();
    SFX.orbBreak();
    for (var i=0;i<10;i++){
      g.particles.push({
        type:'orbBreak', x:p.x + rand(-10,10), y:p.y + rand(-10,10),
        vx: rand(-120,120), vy: rand(-120,120),
        life: rand(0.3,0.6), maxLife:0.6, color: '#a8e0ff'
      });
    }
  }
  return true;
}

function damagePlayer(g, dmg){
  var p = g.player;
  if (p.invuln > 0 || p.dead) return;
  var cappedDmg = Math.min(dmg, p.maxHp * p.damCap);
  if (p.orbAlive){ tryOrbAbsorb(g, cappedDmg); return; }
  var final = cappedDmg * p.armorMult;
  p.hp -= final;
  p.invuln = 0.5;
  g.hitFlash = 0.25;
  g.screenShake = 6;
  SFX.hurt();
  if (p.hp <= 0){ p.hp = 0; p.dead = true; endGame('death'); }
}

function checkLevelUp(g){
  while (g.xp >= g.xpNext){
    g.xp -= g.xpNext;
    g.level++;
    g.xpNext = xpForLevel(g.level);
    g.pendingUpgrades.push(1);
  }
  if (g.pendingUpgrades.length > 0 && state === 'playing') showUpgradePanel();
}

function buildCandidatePool(g){
  var p = g.player;
  var pool = [];
  for (var i=0;i<UPGRADES.length;i++){
    var u = UPGRADES[i];
    var lv = g.upgradeLevels[u.id] || 0;
    if (lv >= u.max) continue;
    pool.push({ type:'upgrade', data:u });
  }
  if (p.optionCount < 10) pool.push({ type:'meta_option' });
  if (p.refreshMax < 6) pool.push({ type:'meta_refresh' });
  pool.push({ type:'global_power', tier: rollTierWeighted() });
  pool.push({ type:'global_speed', tier: rollTierWeighted() });
  if (p.orbitLevel > 0){
    var respT = p.getOrbRespawnTime();
    if (respT > 0.65) pool.push({ type:'orb_speed', tier: rollTierWeighted() });
  }
  if (p.novaLevel > 0){
    pool.push({ type:'nova_power', tier: rollTierWeighted() });
    pool.push({ type:'nova_speed', tier: rollTierWeighted() });
  }
  for (var wid in WEAPONS){
    var w = WEAPONS[wid];
    if (w.category !== 'universal') continue;
    if (p.universalWeapons[wid]) continue;
    pool.push({ type:'weapon_new', data:w, wid:wid });
  }
  for (var wid2 in p.universalWeapons){
    var w2 = WEAPONS[wid2];
    var lv2 = p.universalWeapons[wid2];
    if (lv2 >= 6) continue;
    pool.push({ type:'weapon_up', data:w2, wid:wid2, lv:lv2 });
  }
  var myWids = p.getAllWeaponIds();
  for (var wi=0; wi<myWids.length; wi++){
    var wid3 = myWids[wi];
    var w3 = WEAPONS[wid3];
    var mod3 = p.weaponMods[wid3];
    if (!mod3) continue;
    if (!w3.noPower) pool.push({ type:'weapon_power', data:w3, wid:wid3, tier: rollTierWeighted() });
    pool.push({ type:'weapon_speed', data:w3, wid:wid3, tier: rollTierWeighted() });
    if (!mod3.greatTranscend){
      for (var st=0; st<4; st++){
        if (!mod3.miniTranscended[st]){
          pool.push({ type:'weapon_exclusive', data:w3, wid:wid3, stage:st, stageCount:mod3.exclusiveCounts[st] });
        }
      }
    }
  }
  if (p.heroKey === 'warlord' && p.warlordDmgLevel < p.warlordDmgMax){
    pool.push({ type:'warlord_dmg' });
  }
  return pool;
}

function getAvailableUpgrades(g, count){
  var p = g.player;
  var pool = buildCandidatePool(g);
  for (var i=pool.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var selected = pool.slice(0, Math.min(count, pool.length));
  var forceOrder = [], speedOrder = [];
  var globalPower = [], globalSpeed = [], orbSpeed = [];
  var novaPower = [], novaSpeed = [], others = [];
  var weaponOrder = p.getAllWeaponIds();
  for (var i2=0;i2<selected.length;i2++){
    var c = selected[i2];
    if (c.type === 'weapon_power') forceOrder.push(c);
    else if (c.type === 'weapon_speed') speedOrder.push(c);
    else if (c.type === 'global_power') globalPower.push(c);
    else if (c.type === 'global_speed') globalSpeed.push(c);
    else if (c.type === 'orb_speed') orbSpeed.push(c);
    else if (c.type === 'nova_power') novaPower.push(c);
    else if (c.type === 'nova_speed') novaSpeed.push(c);
    else others.push(c);
  }
  forceOrder.sort(function(a, b){ return weaponOrder.indexOf(a.wid) - weaponOrder.indexOf(b.wid); });
  speedOrder.sort(function(a, b){ return weaponOrder.indexOf(a.wid) - weaponOrder.indexOf(b.wid); });
  return [].concat(forceOrder).concat(speedOrder).concat(globalPower).concat(globalSpeed)
           .concat(orbSpeed).concat(novaPower).concat(novaSpeed).concat(others);
}

function setGreatTranscend(p, w, rt){

  else if (id === 'hero_magic_mage') rt._transcend = 'arcaneVortex';
  else if (id === 'hero_melee_rogue') rt._transcend = 'knifeBurst';
  else if (id === 'hero_melee_warlock') rt._transcend = 'fireTornado';
  else if (id === 'uni_boomerang') rt._transcend = 'shardBurst';
  else if (id === 'uni_frost') rt._transcend = 'frostNova';
  else if (id === 'uni_lightning') rt._transcend = 'thunderStorm';
  else if (id === 'uni_firewhirl') rt._transcend = 'firewhirlStorm';
  else if (id === 'uni_gravity') rt._transcend = 'singularity';

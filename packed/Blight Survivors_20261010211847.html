        var badgeP = '<span class="tier-badge '+TIER_CLASSES[t3]+'">'+TIER_NAMES[t3]+'</span>';
        card.classList.add('tier-' + TIER_CLASSES[t3]);
        html = '<div class="upgrade-tag power">独立力量</div>' +
          '<div class="upgrade-icon">'+w3.icon+'</div>' +
          '<div class="upgrade-name">'+w3.name+' · 力量 '+badgeP+'</div>' +
          '<div class="upgrade-desc">+'+Math.round(newVal*100)+'% → 总 <b>+'+Math.round((cur3+newVal)*100)+'%</b></div>' +
          '<div class="upgrade-lv">无限叠加</div>';
      }
      else if (choice.type === 'weapon_speed'){
        var w4 = choice.data;
        var t4 = choice.tier;
        var newValS = tierValue(BASE_IND_SPEED, t4);
        var cur4 = sumTierCounts(BASE_IND_SPEED, p.weaponMods[choice.wid].speedCounts);
        var badgeS = '<span class="tier-badge '+TIER_CLASSES[t4]+'">'+TIER_NAMES[t4]+'</span>';
        card.classList.add('tier-' + TIER_CLASSES[t4]);
        html = '<div class="upgrade-tag speed">独立速度</div>' +
          '<div class="upgrade-icon">'+w4.icon+'</div>' +
          '<div class="upgrade-name">'+w4.name+' · 速度 '+badgeS+'</div>' +
          '<div class="upgrade-desc">+'+Math.round(newValS*100)+'% → 总 <b>+'+Math.round((cur4+newValS)*100)+'%</b></div>' +
          '<div class="upgrade-lv">无限叠加</div>';
      }
      else if (choice.type === 'weapon_exclusive'){
        var w5 = choice.data;
        var st = choice.stage;
        var stData = w5.exclusiveStages[st];
        var cnt = choice.stageCount + 1;
        var willTrigger = (cnt >= EXCLUSIVE_MAX_PER_STAGE);
        card.classList.add('tier-exclusive');
        if (willTrigger) card.classList.add('transcend');
        html = '<div class="upgrade-tag exclusive">专属 '+(st+1)+'/4</div>' +
          '<div class="upgrade-icon">'+w5.icon+'</div>' +
          (willTrigger ? '<div class="mini-transcend-label">小质变</div>' : '') +
          '<div class="upgrade-name">'+stData.name+'</div>' +
          '<div class="upgrade-desc">'+stData.desc+'</div>' +
          '<div class="upgrade-lv">本阶段 '+cnt+' / 3</div>';
      }
      else if (choice.type === 'warlord_dmg'){
        var nextLv = p.warlordDmgLevel + 1;
        var bonus = nextLv * p.warlordDmgPerLevel;
        card.classList.add('tier-exclusive');
        html = '<div class="upgrade-tag exclusive">武曲星</div>' +
          '<div class="upgrade-icon">🌟</div>' +
          '<div class="upgrade-name">武曲星·伤害</div>' +
          '<div class="upgrade-desc">双枪基础伤害 <b>+' + bonus + '</b></div>' +
          '<div class="upgrade-lv">已选 ' + p.warlordDmgLevel + ' / ' + p.warlordDmgMax + '</div>';
      }
      card.innerHTML = html;
      card.onclick = function(){ selectUpgrade(choice); };
      container.appendChild(card);
    })(choices[ci]);
  }
}

function showUpgradePanel(){
  state = 'upgrade';
  var g = game;
  var p = g.player;
  if (g.pendingUpgrades.length === 0){ state = 'playing'; return; }
  g.refreshLeft = p.refreshMax;
  regenerateChoices();
  updateRefreshBtn();
  showPanel('upgradePanel');
  SFX.upgrade();
}

function selectUpgrade(choice){
  applyUpgradeChoice(game, choice);
  game.pendingUpgrades.shift();
  if (game.pendingUpgrades.length > 0) showUpgradePanel();
  else { state = 'playing'; showPanel(null); }
}

// ============================================================
//  主循环
// ============================================================
var lastTime = 0;
function loop(ts){
  var dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  try {
    if (state === 'playing') update(dt);
    render(dt);
  } catch(e) { console.error('Game loop error:', e); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  var g = game;
  var p = g.player;
  g.time += dt;

  if (p.hasteTimer > 0) p.hasteTimer -= dt;
  if (p.hasteBuffTimer > 0){
    p.hasteBuffTimer -= dt;
    if (p.hasteBuffTimer <= 0){ p.hasteBuff = 0; p.hasteBuffTimer = 0; }
  }
  if (p.powerBuffTimer > 0){
    p.powerBuffTimer -= dt;
    if (p.powerBuffTimer <= 0){ p.powerBuff = 0; p.powerBuffTimer = 0; }
  }
  if (p.gravityBuffTimer > 0){
    p.gravityBuffTimer -= dt;
    if (p.gravityBuffTimer <= 0){
      p.gravityBuffTimer = 0;
      p.gravityPowBuff = 0;
      p.gravitySpdBuff = 0;
    }
  }

  var mx = 0, my = 0;
  if (controlMode === 'mouse'){
    if (mouseScreen.inited){
      var worldMouseX = (mouseScreen.x - W/2) / zoomLevel + cam.x;
      var worldMouseY = (mouseScreen.y - H/2) / zoomLevel + cam.y;
      var dxm = worldMouseX - p.x;
      var dym = worldMouseY - p.y;
      var dm = Math.sqrt(dxm*dxm + dym*dym);
      if (dm > 5){
        mx = dxm / dm;
        my = dym / dm;
      }
    }
  } else {
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (joystick.active){ mx += joystick.dx; my += joystick.dy; }
  }
  var ml = Math.sqrt(mx*mx + my*my);
  if (ml > 1){ mx /= ml; my /= ml; }
  p.x += mx * p.baseSpeed * p.speedMult * dt;
  p.y += my * p.baseSpeed * p.speedMult * dt;
  if (mx !== 0) p.facing = mx > 0 ? 1 : -1;

  cam.x += (p.x - cam.x) * Math.min(1, dt*7);
  cam.y += (p.y - cam.y) * Math.min(1, dt*7);

  if (p.invuln > 0) p.invuln -= dt;
  if (p.regen > 0) p.hp = Math.min(p.maxHp, p.hp + p.regen*dt);

  if (p.orbitLevel > 0 && !p.orbAlive){
    p.orbRespawnTimer -= dt;
    if (p.orbRespawnTimer <= 0){
      p.orbAlive = true;
      p.orbHp = p.orbMaxHp;
      p.orbRespawnTimer = 0;
      SFX.orbReborn();
    }
  }

  if (g.waveSpawnQueue.length > 0){
    g.waveSpawnTimer -= dt;
    if (g.waveSpawnTimer <= 0){
      var key = g.waveSpawnQueue.shift();
      var angle = Math.random()*Math.PI*2;
      var spawnR = Math.max(W,H)*0.62 + 60;
      var sx = p.x + Math.cos(angle)*spawnR;
      var sy = p.y + Math.sin(angle)*spawnR;
      var spawned = spawnEnemyAt(g, key, sx, sy);
      if (spawned){
        g.currentWaveEnemyIds[spawned.id] = true;
        g.currentWaveSpawnedCount += 1;
        g.currentWaveSpawnedHp += spawned.maxHp;
        g.currentWaveTotalHp += spawned.maxHp;
      }
      var spawnBase = Math.max(0.003, 0.01 - g.wave * 0.0002);
      g.waveSpawnTimer = spawnBase + Math.random() * spawnBase * 2;
    }
  }

  var currentWaveHp = 0;
  var enemiesAlive = 0;
  for (var wei=0; wei<g.enemies.length; wei++){
    var we = g.enemies[wei];
    if (we.dead) continue;
    enemiesAlive++;
    if (g.currentWaveEnemyIds[we.id]) currentWaveHp += we.hp;
  }

  g.waveTimer -= dt;

  var waveFullySpawned = (g.waveSpawnQueue.length === 0);
  var waveCleared = waveFullySpawned
                 && g.currentWaveSpawnedCount > 0
                 && enemiesAlive === 0;

  if (g.waveTimer <= 0 || waveCleared){
    startWave(g);
    g.waveTimer = getWaveInterval();
  }

  g.claimedTargets = {};
  var wids = p.getAllWeaponIds();
  wids.sort(function(a,b){
    var wa = WEAPONS[a], wb = WEAPONS[b];
    var pa = wa.wtype === 'control' ? 0 : (wa.wtype === 'utility' ? 1 : (wa.wtype === '终结' ? 2 : 3));
    var pb = wb.wtype === 'control' ? 0 : (wb.wtype === 'utility' ? 1 : (wb.wtype === '终结' ? 2 : 3));
    return pa - pb;
  });

  for (var wi=0; wi<wids.length; wi++){
    var wid = wids[wi];
    var stats = p.getWeaponStats(wid);
    if (!stats) continue;
    if (p.weaponTimers[wid] === undefined) p.weaponTimers[wid] = 0;
    p.weaponTimers[wid] -= dt;
    if (p.weaponTimers[wid] <= 0){
      p.weaponTimers[wid] = stats.atkInterval;
      var mod = p.weaponMods[wid];
      if (mod && mod.runtime._echoChance && Math.random() < mod.runtime._echoChance) p.weaponTimers[wid] = 0;
      weaponAttack(g, wid);
    }
  }

  if (p.novaLevel > 0){
    p.novaTimer -= dt;
    if (p.novaTimer <= 0){
      var baseInterval = Math.max(1.6, 3.5 - p.novaLevel*0.35);
      var novaSpeedBonus = sumTierCounts(NOVA_SPEED_BASE, p.novaSpeedCounts);
      p.novaTimer = baseInterval / (1 + novaSpeedBonus);
      var novaPowerBonus = sumTierCounts(NOVA_POWER_BASE, p.novaPowerCounts);
      var novaDmg = 20 * (1 + novaPowerBonus);
      var radius = 110 + p.novaLevel*35;
      g.novae.push({ x:p.x, y:p.y, radius:0, maxRadius:radius, life:0.5, maxLife:0.5, color:'#a8e8ff' });
      var _prevSrc = g._dmgSource;
      g._dmgSource = '__nova__';
      for (var ni=0;ni<g.enemies.length;ni++){
        var en = g.enemies[ni];
        if (en.dead) continue;
        var nlim = radius + en.radius;
        if (distSq(p.x, p.y, en.x, en.y) < nlim*nlim){
          var ang = Math.atan2(en.y-p.y, en.x-p.x);
          applyHit(g, en, novaDmg, 30, ang, undefined);
        }
      }
      g._dmgSource = _prevSrc;
    }
  }

  var playerTotalAtk = p.getTotalAttack();

  for (var ai=0;ai<g.enemies.length;ai++){
    var en2 = g.enemies[ai];
    if (en2.dead) continue;
    var dx = p.x - en2.x, dy = p.y - en2.y;
    var dEn = Math.sqrt(dx*dx + dy*dy) || 1;
    en2.wobble += dt*4;

    if (en2.slowTimer > 0){ en2.slowTimer -= dt; if (en2.slowTimer <= 0) en2.slowFactor = 1; }
    if (en2.freezeTimer > 0){ en2.freezeTimer -= dt; }
    if (en2.stunTimer > 0){ en2.stunTimer -= dt; }

    if (en2.burnTimer > 0){
      en2.burnTimer -= dt;
      if (!en2.burnCritTimer || en2.burnCritTimer <= 0){
        en2.burnCritTimer = 1.0;
        en2.burnCritFlag = p.rollCrit();
      }
      en2.burnCritTimer -= dt;
      var burnMulti = en2.burnCritFlag ? 4 : 1;
      var burnDmg = en2.burnDps * dt * burnMulti;
      en2.hp -= burnDmg;
      var _burnSrc = en2._burnSrc || 'hero_melee_warlock';
      g.damageStats[_burnSrc] = (g.damageStats[_burnSrc] || 0) + burnDmg;
      if (Math.random() < 0.15){
        g.particles.push({ type:'spark', x:en2.x + rand(-6,6), y:en2.y + rand(-6,6),
          vx: rand(-20,20), vy: rand(-40,-10), life: 0.4, maxLife: 0.4, color: '#ff8a3d' });
      }
      if (en2.hp <= 0 && !en2.dead) killEnemy(g, en2, 0);
    }

    if (en2.toxinMarks > 0){
      var toxRt = p.weaponMods['uni_toxin'] && p.weaponMods['uni_toxin'].runtime;
      var toxInterval = 3.0;
      if (toxRt) toxInterval = Math.max(1.0, 3.0 - (toxRt._tickSpd||0));
      en2.toxinTickTimer = (en2.toxinTickTimer > toxInterval ? toxInterval : en2.toxinTickTimer||toxInterval);
      en2.toxinTickTimer -= dt;
      if (en2.toxinTickTimer <= 0){
        en2.toxinTickTimer = toxInterval;
        var dmgPct = en2.toxinMarks * 0.005;
        var toxDmg = en2.maxHp * dmgPct;
        en2.hp -= toxDmg;
        g.damageStats['uni_toxin'] = (g.damageStats['uni_toxin']||0) + toxDmg;
        en2.toxinMarks = Math.max(0, en2.toxinMarks - 1);
        if (Math.random() < 0.15){
          g.particles.push({ type:'spark', x:en2.x + rand(-6,6), y:en2.y + rand(-6,6),
            vx: rand(-20,20), vy: rand(-40,-10), life:0.4, maxLife:0.4, color:'#5aff5a' });
        }
        if (en2.hp <= 0 && !en2.dead) killEnemy(g, en2, 0);
      }
    }

    if (en2.isBoss){
      if (en2.selfHeal){
        en2.healTimer -= dt;
        if (en2.healTimer <= 0){
          en2.healTimer = 3.0;
          var healMax = playerTotalAtk * 100;
          var healBase = en2.maxHp * 0.05;
          var healAmt = Math.min(healBase, healMax);
          if (healAmt > 0){
            en2.hp = Math.min(en2.maxHp, en2.hp + healAmt);
            g.particles.push({ type:'spark', x:en2.x, y:en2.y, vx:0, vy:-40, life:0.6, maxLife:0.6, color:'#5aff9a' });
          }
        }
      }
      if (en2.summonMinions){
        en2.summonTimer -= dt;
        if (en2.summonTimer <= 0){
          en2.summonTimer = 5.0;
          for (var sm=0; sm<3; sm++){
            var sa = Math.random()*Math.PI*2;
            var sr = 40 + Math.random()*30;
            spawnEnemyAt(g, 'bat', en2.x + Math.cos(sa)*sr, en2.y + Math.sin(sa)*sr);
          }
        }
      }
      if (en2.chargeDash){
        en2.dashTimer -= dt;
        if (en2.dashActive > 0) en2.dashActive -= dt;
        else if (en2.dashTimer <= 0){ en2.dashTimer = 4.0; en2.dashActive = 0.6; }
      }
    }

    var stopped = en2.freezeTimer > 0 || en2.stunTimer > 0;
    var spd = stopped ? 0 : en2.speed * en2.slowFactor;
    if (en2.dashActive > 0) spd *= 2.5;

    if (!stopped){
      var angE = Math.atan2(dy,dx);
      if (en2.ai === 'ranged'){
        var moveDir = 0;
        if (dEn > en2.atkRange * 1.0) moveDir = 1;
        else if (dEn < en2.atkRange * 0.6) moveDir = -1;
        if (moveDir !== 0){
          en2.x += Math.cos(angE) * spd * moveDir * dt;
          en2.y += Math.sin(angE) * spd * moveDir * dt;
        }
        en2.atkTimer -= dt;
        if (en2.atkTimer <= 0 && dEn <= en2.atkRange){
          en2.atkTimer = en2.atkInterval;
          var shotCount = en2.tripleShot ? 3 : 1;
          for (var sc=0; sc<shotCount; sc++){
            var sAng = angE + (shotCount>1 ? (sc-(shotCount-1)/2) * 0.25 : 0);
            g.enemyProjectiles.push({
              x: en2.x, y: en2.y,
              vx: Math.cos(sAng) * en2.projSpeed,
              vy: Math.sin(sAng) * en2.projSpeed,
              radius: en2.projRadius || 6, damage: en2.dmg, life: 3.5,
              homing: en2.homing, homingTime: en2.homing ? 2.0 : 0,
              color: en2.color, icon: en2.icon
            });
          }
        }
      } else {
        var wob = (en2.flying) ? Math.sin(en2.wobble)*0.35 : 0;
        var angC = angE + wob;
        en2.x += Math.cos(angC) * spd * dt;
        en2.y += Math.sin(angC) * spd * dt;
      }
    }

    if (en2._whirlPull){
      if (en2._whirlPull.life <= 0){
        en2._whirlPull = null;
      } else {
        var wRef = en2._whirlPull;
        var dxw = wRef.x - en2.x, dyw = wRef.y - en2.y;
        var dw = Math.sqrt(dxw*dxw + dyw*dyw);
        if (dw > 1){
          var pullSpd = Math.sqrt(wRef.vx*wRef.vx + wRef.vy*wRef.vy);
          var pullAmt = Math.min(dw, pullSpd * dt * 1.2);
          en2.x += dxw/dw * pullAmt;
          en2.y += dyw/dw * pullAmt;
        }
      }
    }

    en2.x += en2.kvx * dt;
    en2.y += en2.kvy * dt;
    var damp = Math.pow(0.001, dt);
    en2.kvx *= damp; en2.kvy *= damp;
    if (Math.abs(en2.kvx) < 1) en2.kvx = 0;
    if (Math.abs(en2.kvy) < 1) en2.kvy = 0;

    if (en2.hitTimer > 0) en2.hitTimer -= dt;
    if (dEn < en2.radius + p.radius) damagePlayer(g, en2.dmg);
  }

  var CELL = 64;
  var grid = {};
  var enemies = g.enemies;
  for (var ii = 0; ii < enemies.length; ii++){
    var e0 = enemies[ii];
    if (e0.dead) continue;
    var cx = Math.floor(e0.x / CELL);
    var cy = Math.floor(e0.y / CELL);
    var kk = cx * 100000 + cy;
    var bucket = grid[kk];
    if (!bucket){ bucket = []; grid[kk] = bucket; }
    bucket.push(e0);
  }
  for (var gk in grid){
    var cell = grid[gk];
    var clen = cell.length;
    for (var i = 0; i < clen; i++){
      var a = cell[i];
      var ar = a.radius;
      for (var j = i + 1; j < clen; j++){
        var b = cell[j];
        if (a.isBoss || b.isBoss) continue;
        var ddx = b.x - a.x, ddy = b.y - a.y;
        var d2sq = ddx*ddx + ddy*ddy;
        var minD = ar + b.radius;
        if (d2sq < minD*minD && d2sq > 0.0001){
          var d2 = Math.sqrt(d2sq);
          var push = (minD - d2) * 0.5;
          var nx = ddx / d2, ny = ddy / d2;
          a.x -= nx*push; a.y -= ny*push;
          b.x += nx*push; b.y += ny*push;
        }
      }
    }
  }
  compact(enemies, function(e){ return e.dead; });

  for (var epi=0; epi<g.enemyProjectiles.length; epi++){
    var ep = g.enemyProjectiles[epi];
    if (ep.homing && ep.homingTime > 0){
      ep.homingTime -= dt;
      var tAng = Math.atan2(p.y - ep.y, p.x - ep.x);
      var cAng = Math.atan2(ep.vy, ep.vx);
      var spd = Math.sqrt(ep.vx*ep.vx + ep.vy*ep.vy);
      var diff = tAng - cAng;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      var nAng = cAng + clamp(diff, -2.5*dt, 2.5*dt);
      ep.vx = Math.cos(nAng)*spd;
      ep.vy = Math.sin(nAng)*spd;
    }
    ep.x += ep.vx * dt;
    ep.y += ep.vy * dt;
    ep.life -= dt;
    if (ep.life <= 0) continue;
    var eplim = p.radius + ep.radius;
    if (distSq(p.x, p.y, ep.x, ep.y) < eplim*eplim){
      damagePlayer(g, ep.damage);
      ep.life = 0;
    }
  }
  compact(g.enemyProjectiles, function(ep){ return ep.life <= 0; });

  for (var pi=0;pi<g.projectiles.length;pi++){
    var pr = g.projectiles[pi];
    if (pr.kind === 'boomerang'){
      pr.t += dt;
      var half = pr.maxT/2;
      if (pr.t < half){
        pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      } else {
        var angB = Math.atan2(p.y - pr.y, p.x - pr.x);
        var spdB = Math.sqrt(pr.vx*pr.vx + pr.vy*pr.vy);
        pr.x += Math.cos(angB) * spdB * dt;
        pr.y += Math.sin(angB) * spdB * dt;
        if (distSq(p.x, p.y, pr.x, pr.y) < 196){
          if (pr.rt && pr.rt.transcend === 'shardBurst'){
            var shardCount = 6 + (pr.rt.shardBurstCount || 0);
            for (var sh=0;sh<shardCount;sh++){
              var ash = (Math.PI*2/shardCount)*sh;
              g.projectiles.push({
                x:pr.x, y:pr.y,
                vx: Math.cos(ash)*280, vy: Math.sin(ash)*280,
                radius:5, damage: pr.damage*0.5, knockback:15, pierce:1,
                hit:{}, life:0.5, color:'#ffe0a0', kind:'shard', src: 'uni_boomerang'
              });
            }
          }
          pr.life = 0;
        }
      }
      for (var eid in pr.hitCooldown){
        if (pr.hitCooldown[eid] > 0) pr.hitCooldown[eid] -= dt;
      }
      for (var bei=0;bei<g.enemies.length;bei++){
        var be = g.enemies[bei];
        if (be.dead) continue;
        var blim = be.radius + pr.radius;
        if (distSq(be.x, be.y, pr.x, pr.y) < blim*blim){
          var lastHit = pr.hitCooldown[be.id] || 0;
          if (lastHit <= 0){
            var angBH = Math.atan2(be.y-pr.y, be.x-pr.x);
            var boomCrit = p.rollCrit();
            var boomDmg = pr.damage * (boomCrit ? 4 : 1);
            applyHit(g, be, boomDmg, pr.knockback, angBH, boomCrit, pr.src);
            pr.hitCooldown[be.id] = 0.35;
          }
        }
      }
    } else if (pr.kind === 'firewhirl'){
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      pr.dist += Math.sqrt(pr.vx*pr.vx + pr.vy*pr.vy) * dt;
      pr.life -= dt;

      for (var hc in pr.hitCd){
        if (pr.hitCd[hc] > 0) pr.hitCd[hc] -= dt;
      }

      for (var wei2 = 0; wei2 < g.enemies.length; wei2++){
        var eW = g.enemies[wei2];
        if (eW.dead) continue;
        var wlim = eW.radius + pr.radius;
        if (distSq(eW.x, eW.y, pr.x, pr.y) < wlim*wlim){
          var lastHitW = pr.hitCd[eW.id] || 0;
          if (lastHitW <= 0){
            var cdW = 0.5;
            if (pr.rt.transcend === 'firewhirlStorm'){
              var spdW = Math.sqrt(pr.vx*pr.vx + pr.vy*pr.vy);
              cdW = Math.max(0.15, (140 / spdW) * 0.5);
            }
            pr.hitCd[eW.id] = cdW;
            var angKW = Math.atan2(eW.y-pr.y, eW.x-pr.x);
            var wCrit = p.rollCrit();
            var wDmg = pr.damage * (wCrit ? 4 : 1);
            applyHit(g, eW, wDmg, pr.knockback, angKW, wCrit, pr.src);

            if (!pr.burnApplied[eW.id]){
              pr.burnApplied[eW.id] = true;
              if (pr.burnDps > 0){
                var maxStk = pr.burnMaxStacks || 1;
                eW.burnStacks = Math.min(maxStk, (eW.burnStacks||0) + 1);
                eW.burnTimer = pr.burnDur;
                eW.burnDps = pr.burnDps * eW.burnStacks;
                eW.burnExplode = false;
                eW._burnSrc = 'uni_firewhirl';
              }
            }

            if (pr.rt.transcend === 'firewhirlStorm'){
              eW._whirlPull = pr;
            }
          }
        }
      }

      if (pr.dist >= pr.maxDist){
        pr.life = 0;
        if (pr.rt.transcend === 'firewhirlStorm'){
          var br = pr.radius * 2;
          var brsq = br * br;
          for (var bei2 = 0; bei2 < g.enemies.length; bei2++){
            var eb2 = g.enemies[bei2];
            if (eb2.dead) continue;
            if (distSq(eb2.x, eb2.y, pr.x, pr.y) < brsq){
              var angB2 = Math.atan2(eb2.y-pr.y, eb2.x-pr.x);
              var kbs = 40;
              if (eb2.knockbackResist) kbs *= (1 - eb2.knockbackResist);
              var kbL = eb2.isBoss ? kbLimitBoss : kbLimitNormal;
              var kbSpd2 = Math.min(kbs * 4, kbL);
              eb2.kvx += Math.cos(angB2) * kbSpd2;
              eb2.kvy += Math.sin(angB2) * kbSpd2;
            }
          }
          g.novae.push({ x:pr.x, y:pr.y, radius:0, maxRadius:br, life:0.3, maxLife:0.3, color:'#ff8a3d' });
        }
      }
    } else if (pr.kind === 'missile'){
      pr.life -= dt;
      var bestId = null; var bestDsq = Infinity;
      for (var mi2=0;mi2<g.enemies.length;mi2++){
        var me2 = g.enemies[mi2];
        if (me2.dead) continue;
        if (pr.hitList.indexOf(me2.id) >= 0) continue;
        var d2 = distSq(pr.x, pr.y, me2.x, me2.y);
        if (d2 < bestDsq){ bestDsq = d2; bestId = me2.id; }
      }
      if (bestId === null){
        for (var mi3=0;mi3<g.enemies.length;mi3++){
          var me3 = g.enemies[mi3];
          if (me3.dead) continue;
          var d3 = distSq(pr.x, pr.y, me3.x, me3.y);
          if (d3 < bestDsq){ bestDsq = d3; bestId = me3.id; }
        }
      }
      if (bestId !== null){
        var target = null;
        for (var mi4=0;mi4<g.enemies.length;mi4++){
          if (g.enemies[mi4].id === bestId){ target = g.enemies[mi4]; break; }
        }
        if (target){
          var angM = Math.atan2(target.y - pr.y, target.x - pr.x);
          pr.vx = Math.cos(angM) * pr.speed;
          pr.vy = Math.sin(angM) * pr.speed;
        }
      }
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;

      for (var pei2=0;pei2<g.enemies.length;pei2++){
        var pe2 = g.enemies[pei2];
        if (pe2.dead) continue;
        if (pr.hitList.indexOf(pe2.id) >= 0) continue;
        var plim2 = pe2.radius + pr.radius;
        if (distSq(pe2.x, pe2.y, pr.x, pr.y) < plim2*plim2){
          var angP2 = Math.atan2(pr.vy, pr.vx);
          var critP2 = p.rollCrit();
          var dmgP2 = pr.damage * (critP2 ? 4 : 1);
          applyHit(g, pe2, dmgP2, pr.knockback, angP2, critP2, pr.src);
          pr.hitList.push(pe2.id);
          if (pr.hitList.length > pr.hitListMax) pr.hitList.shift();
        }
      }
    } else if (pr.kind === 'toxin'){
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      pr.life -= dt;
      pr.dist += Math.sqrt(pr.vx*pr.vx + pr.vy*pr.vy) * dt;

      var isPierce = (pr.rt.transcend === 'toxinPierce');
      pr._pierced = pr._pierced || 0;
      for (var txi=0;txi<g.enemies.length;txi++){
        var tx = g.enemies[txi];
        if (tx.dead || pr.hit[tx.id]) continue;
        var tlim = tx.radius + pr.radius;
        if (distSq(tx.x, tx.y, pr.x, pr.y) < tlim*tlim){
          var angTX = Math.atan2(pr.vy, pr.vx);
          var tCrit = p.rollCrit();
          var tDmg = pr.damage * (tCrit ? 4 : 1);
          applyHit(g, tx, tDmg, pr.knockback, angTX, tCrit, pr.src);

          tx.toxinMarks = Math.min(pr.rt.markCap, (tx.toxinMarks||0) + 1);
          tx.toxinTickTimer = Math.min(3.0, tx.toxinTickTimer||3.0);
          tx.toxinSrc = 'uni_toxin';

          g.toxinCircles.push({
            x: tx.x, y: tx.y,
            radius: pr.rt.circleR,
            life: pr.rt.circleLife, maxLife: pr.rt.circleLife,
            markCap: pr.rt.markCap
          });

          pr._pierced++;
          if (!isPierce || pr._pierced >= pr.rt.pierceMax){
            pr.life = 0;
            break;
          }
          pr.hit[tx.id] = 1;
        }
      }

      if (pr.dist >= pr.maxDist || pr.life <= 0) pr.life = 0;
    } else {
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      pr.life -= dt;
      for (var pei=0;pei<g.enemies.length;pei++){
        var pe = g.enemies[pei];
        if (pe.dead || pr.hit[pe.id]) continue;
        var plim = pe.radius + pr.radius;
        if (distSq(pe.x, pe.y, pr.x, pr.y) < plim*plim){
          var angP = Math.atan2(pr.vy, pr.vx);
          var rtP = pr.rt || {};
          var dmgP = pr.damage;
          if (rtP.executeFull && pe.hp >= pe.maxHp) dmgP *= 1.4 + (rtP.executeFullBonus || 0);
          var critP = p.rollCrit();
          if (critP) dmgP *= 4;
          applyHit(g, pe, dmgP, pr.knockback, angP, critP, pr.src);

          if (pr.slow > 0){ pe.slowFactor = 1 - pr.slow; pe.slowTimer = pr.slowDur; }
          if (rtP.freezeStacks){
            pe.frostStacks = (pe.frostStacks || 0) + 1;
            if (pe.frostStacks >= rtP.freezeStacks){
              pe.freezeTimer = rtP.freezeDuration || 1.0;
              pe.frostStacks = 0;
            }
          }
          if (rtP.splash){
            var sr2 = rtP.splashR * rtP.splashR;
            for (var se=0;se<g.enemies.length;se++){
              var se2 = g.enemies[se];
              if (se2 === pe || se2.dead) continue;
              if (distSq(se2.x, se2.y, pe.x, pe.y) < sr2){
                applyHit(g, se2, dmgP*rtP.splash, 0, Math.atan2(se2.y-pe.y, se2.x-pe.x), undefined, pr.src);
              }
            }
            g.novae.push({ x:pe.x, y:pe.y, radius:0, maxRadius:rtP.splashR, life:0.25, maxLife:0.25, color:'#c9b6ff' });
          }
          if (rtP.critSplit && critP){
            var baseA = angP + Math.PI;
            for (var ks=-1;ks<=1;ks+=2){
              var a2c = baseA + ks*0.6;
              g.projectiles.push({
                x:pe.x, y:pe.y,
                vx: Math.cos(a2c)*500, vy: Math.sin(a2c)*500,
                radius:4, damage: pr.damage*0.6, knockback:12, pierce:1,
                hit:{}, life:0.8, color:'#b6ffc4', kind:'arrow', src: 'hero_arrow_ranger'
              });
            }
          }
          if (rtP.transcend === 'arrowSplit'){
            var arrowCount = 3 + (rtP.arrowSplitCount || 0);
            for (var kk2=0;kk2<arrowCount;kk2++){
              var a2s = angP + (kk2 - (arrowCount-1)/2)*0.5;
              g.projectiles.push({
                x:pe.x, y:pe.y,
                vx: Math.cos(a2s)*380, vy: Math.sin(a2s)*380,
                radius:4, damage: pr.damage*0.5, knockback:10, pierce:1,
                hit:{}, life:0.7, color:'#a8ffd0', kind:'arrow',
                homing:true, src: 'hero_arrow_ranger'
              });
            }
          }
          if (rtP.transcend === 'arcaneVortex'){
            var vBonus = 1 + (rtP.vortexDmgBonus || 0);
            g.vortexes.push({ x:pe.x, y:pe.y, radius:50, life:3, maxLife:3, tickTimer:0, damage: pr.damage*0.35*vBonus });
          }
          if (rtP.transcend === 'frostNova'){
            var novaBonus = 1 + (rtP.frostNovaBonus || 0);
            var rN = 90;
            var rNsq = rN*rN;
            g.novae.push({ x:pe.x, y:pe.y, radius:0, maxRadius:rN, life:0.4, maxLife:0.4, color:'#a8e8ff' });
            for (var ne=0;ne<g.enemies.length;ne++){
              var ne2 = g.enemies[ne];
              if (ne2 === pe || ne2.dead) continue;
              if (distSq(ne2.x, ne2.y, pe.x, pe.y) < rNsq){
                var fnCrit = p.rollCrit();
                var fnDmg = pr.damage*0.6*novaBonus * (fnCrit ? 4 : 1);
                applyHit(g, ne2, fnDmg, 30, Math.atan2(ne2.y-pe.y, ne2.x-pe.x), fnCrit, pr.src);
                ne2.slowFactor = 0.4; ne2.slowTimer = 1.5;
              }
            }
          }
          pr.hit[pe.id] = 1;
          if (pr.pierce <= 0){ pr.life = 0; break; }
          pr.pierce--;
        }
      }
      if (pr.homing && pr.life > 0){
        var nearest2 = null, nd2 = Infinity;
        for (var hi=0;hi<g.enemies.length;hi++){
          var he = g.enemies[hi];
          if (he.dead) continue;
          var dd2 = distSq(he.x, he.y, pr.x, pr.y);
          if (dd2 < nd2){ nd2 = dd2; nearest2 = he; }
        }
        if (nearest2 && nd2 < 90000){
          var targetAng2 = Math.atan2(nearest2.y-pr.y, nearest2.x-pr.x);
          var curAng2 = Math.atan2(pr.vy, pr.vx);
          var spd2 = Math.sqrt(pr.vx*pr.vx + pr.vy*pr.vy);
          var diff2 = targetAng2 - curAng2;
          while (diff2 > Math.PI) diff2 -= Math.PI*2;
          while (diff2 < -Math.PI) diff2 += Math.PI*2;
          var newAng2 = curAng2 + clamp(diff2, -6*dt, 6*dt);
          pr.vx = Math.cos(newAng2)*spd2;
          pr.vy = Math.sin(newAng2)*spd2;
        }
      }
    }
  }
  compact(g.projectiles, function(pr){ return pr.life <= 0; });

  for (var vi=0;vi<g.vortexes.length;vi++){
    var v = g.vortexes[vi];
    v.life -= dt;
    v.tickTimer -= dt;
    if (v.tickTimer <= 0){
      v.tickTimer = 0.35;
      var vsq = v.radius*v.radius;
      var _prevSrc2 = g._dmgSource;
      g._dmgSource = 'hero_magic_mage';
      for (var vei=0;vei<g.enemies.length;vei++){
        var ve = g.enemies[vei];
        if (ve.dead) continue;
        if (distSq(ve.x, ve.y, v.x, v.y) < vsq){
          var vCrit = p.rollCrit();
          var vDmg = v.damage * (vCrit ? 4 : 1);
          applyHit(g, ve, vDmg, 0, Math.atan2(ve.y-v.y, ve.x-v.x), vCrit);
        }
      }
      g._dmgSource = _prevSrc2;
    }
  }
  compact(g.vortexes, function(v){ return v.life <= 0; });

  // 毒圈更新
  var toxRt2 = p.weaponMods['uni_toxin'] && p.weaponMods['uni_toxin'].runtime;
  var toxMarkCap = 1 + (toxRt2 ? (toxRt2._markCap||0) : 0);
  for (var tci=0;tci<g.toxinCircles.length;tci++){
    var tc = g.toxinCircles[tci];
    tc.life -= dt;
    tc.tickTimer = (tc.tickTimer > 0.5 ? 0.5 : tc.tickTimer||0.5);
    tc.tickTimer -= dt;
    if (tc.tickTimer <= 0){
      tc.tickTimer = 0.5;
      var tcRsq = tc.radius * tc.radius;
      for (var tcei=0;tcei<g.enemies.length;tcei++){
        var tce = g.enemies[tcei];
        if (tce.dead) continue;
        if (distSq(tce.x, tce.y, tc.x, tc.y) < tcRsq){
          tce.toxinMarks = Math.min(tc.markCap, (tce.toxinMarks||0) + 1);
          tce.toxinTickTimer = Math.min(3.0, tce.toxinTickTimer||3.0);
          tce.toxinSrc = 'uni_toxin';
        }
      }
    }
  }
  compact(g.toxinCircles, function(tc){ return tc.life <= 0; });

  // 裁决之剑更新
  for (var jsi=0;jsi<g.judgmentSwords.length;jsi++){
    var js = g.judgmentSwords[jsi];
    js.phaseTimer += dt;

    if (js.phase === 'flying'){
      var dxJ = js.targetX - js.x;
      var dyJ = (js.targetY - 60) - js.y;
      var dJ = Math.sqrt(dxJ*dxJ + dyJ*dyJ) || 1;
      var moveJ = js.speed * dt;
      if (moveJ >= dJ){
        js.x = js.targetX;
        js.y = js.targetY - 60;
        js.phase = 'hovering';
        js.phaseTimer = 0;
      } else {
        js.x += dxJ/dJ * moveJ;
        js.y += dyJ/dJ * moveJ;

        // 路径伤害
        for (var jpe=0;jpe<g.enemies.length;jpe++){
          var jpe2 = g.enemies[jpe];
          if (jpe2.dead || js.hitEnemies[jpe2.id]) continue;
          var jplim = jpe2.radius + js.radius + 8;
          if (distSq(jpe2.x, jpe2.y, js.x, js.y) < jplim*jplim){
            js.hitEnemies[jpe2.id] = 1;
            var jpCrit = p.rollCrit();
            var jpDmg = js.damage * (jpCrit ? 4 : 1);
            applyHit(g, jpe2, jpDmg, 30, Math.atan2(jpe2.y-js.y, jpe2.x-js.x), jpCrit, js.src);
          }
        }
      }
    } else if (js.phase === 'hovering'){
      var jtarget = null;
      for (var jti=0;jti<g.enemies.length;jti++){
        if (g.enemies[jti].id === js.targetId && !g.enemies[jti].dead){
          jtarget = g.enemies[jti]; break;
        }
      }
      if (!jtarget){
        js.phase = 'done'; js.phaseTimer = 0; continue;
      }
      jtarget.stunTimer = Math.max(jtarget.stunTimer||0, dt + 0.5);
      js.x = jtarget.x;
      js.y = jtarget.y - 60;
      if (js.phaseTimer >= 0.5){
        js.phase = 'dropping';
        js.phaseTimer = 0;
      }
    } else if (js.phase === 'dropping'){
      var jtarget2 = null;
      for (var jti2=0;jti2<g.enemies.length;jti2++){
        if (g.enemies[jti2].id === js.targetId && !g.enemies[jti2].dead){
          jtarget2 = g.enemies[jti2]; break;
        }
      }
      if (!jtarget2){
        js.phase = 'done'; js.phaseTimer = 0; continue;
      }
      js.y += js.speed * 2 * dt;
      if (js.y >= jtarget2.y){
        // 斩杀
        var exDmgJ = jtarget2.hp;
        applyHit(g, jtarget2, exDmgJ, 0, 0, false, js.src);

        // 冲击波
        if (js.impactR > 0){
          var impR = js.impactR;
          var impRsq = impR * impR;
          g.novae.push({ x:jtarget2.x, y:jtarget2.y, radius:0, maxRadius:impR, life:0.5, maxLife:0.5, color:'#ffd76e' });
          for (var impe=0;impe<g.enemies.length;impe++){
            var ime = g.enemies[impe];
            if (ime.dead || ime.id === js.targetId) continue;
            if (distSq(ime.x, ime.y, jtarget2.x, jtarget2.y) < impRsq){
              var imCrit = p.rollCrit();
              var imDmg = js.damage * (imCrit ? 4 : 1);
              applyHit(g, ime, imDmg, js.impactR > 0 ? 60 : 0, Math.atan2(ime.y-jtarget2.y, ime.x-jtarget2.x), imCrit, js.src);
              if (js.slowPct > 0){
                ime.slowFactor = Math.min(ime.slowFactor||1, 1 - js.slowPct);
                ime.slowTimer = Math.max(ime.slowTimer||0, 2.0);
              }
            }
          }
        }

        // 大质变连锁
        if (js.rt && js.rt._transcend === 'judgmentChain' && js.chainCount < 2){
          var chainThres = 6 + (js.rt._threshold||0);
          var chainTarget = null; var chainHp = -1;
          for (var che=0;che<g.enemies.length;che++){
            var che2 = g.enemies[che];
            if (che2.dead || che2.id === js.targetId || (che2.isBoss && !js.rt._transcend)) continue;
            var chpPct = che2.hp / che2.maxHp * 100;
            if (chpPct < chainThres && che2.hp > chainHp){
              chainHp = che2.hp; chainTarget = che2;
            }
          }
          if (chainTarget){
            g.judgmentSwords.push({
              x: jtarget2.x, y: jtarget2.y - 80,
              targetId: chainTarget.id, targetX: chainTarget.x, targetY: chainTarget.y,
              phase: 'flying', phaseTimer: 0,
              damage: js.damage, speed: js.speed,
              radius: 14, hitEnemies: {},
              impactR: js.impactR, slowPct: js.slowPct,
              src: js.src, rt: js.rt, chainCount: (js.chainCount||0) + 1
            });
          }
        }

        js.phase = 'done';
      }
    }
  }
  compact(g.judgmentSwords, function(js){ return js.phase === 'done'; });

  var pickupR = p.pickupRange;
  for (var gi=0;gi<g.gems.length;gi++){
    var gem = g.gems[gi];
    gem.life -= dt;
    var dG = Math.sqrt(distSq(p.x, p.y, gem.x, gem.y));
    if (dG < pickupR){
      var angG = Math.atan2(p.y-gem.y, p.x-gem.x);
      var pull = 420 * (1 - dG/pickupR) + 120;
      gem.x += Math.cos(angG)*pull*dt;
      gem.y += Math.sin(angG)*pull*dt;
    } else {
      gem.x += gem.vx*dt; gem.y += gem.vy*dt;
      gem.vx *= 0.92; gem.vy *= 0.92;
    }
    if (dG < p.radius + gem.radius + 4){ g.xp += gem.value; gem.life = 0; SFX.gem(); }
  }
  compact(g.gems, function(gm){ return gm.life <= 0; });
  checkLevelUp(g);

  g.chestTimer = (g.chestTimer || 0) - dt;
  if (!g.chests) g.chests = [];
  if (g.chestTimer <= 0){
    g.chestTimer = rand(16, 26);
    var angCh = Math.random()*Math.PI*2;
    var rCh = rand(180, 340);
    g.chests.push({ x: p.x + Math.cos(angCh)*rCh, y: p.y + Math.sin(angCh)*rCh, radius:16, bob:0, opened:false });
  }
  for (var ci2=0;ci2<g.chests.length;ci2++){
    var c = g.chests[ci2];
    c.bob += dt*3;
    if (c.attracting && !c.opened){
      var dxc = p.x - c.x, dyc = p.y - c.y;
      var dc = Math.sqrt(dxc*dxc + dyc*dyc);
      if (dc > 1){
        var pull2 = Math.min(dc, 900 * dt);
        c.x += dxc / dc * pull2;
        c.y += dyc / dc * pull2;
      }
    }
    var cLim = Math.max(p.radius + c.radius + 6, p.pickupRange * 0.55);
    if (!c.opened && distSq(p.x, p.y, c.x, c.y) < cLim*cLim){
      c.opened = true;
      g.pendingUpgrades.push(1);
      p.hp = Math.min(p.maxHp, p.hp + p.maxHp*0.25);
      g.goldEarned += 15;
      toast('🎁 宝箱！获得升级');
      for (var pi2=0;pi2<20;pi2++){
        g.particles.push({ type:'spark', x:c.x, y:c.y,
          vx: rand(-200,200), vy: rand(-200,200),
          life: rand(0.4,0.9), maxLife:0.9, color: '#ffd76e' });
      }
      if (state === 'playing') showUpgradePanel();
    }
  }

  for (var pti=0;pti<g.particles.length;pti++){
    var pt = g.particles[pti];
    pt.life -= dt;
    if (pt.type === 'spark'){ pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx*=0.94; pt.vy*=0.94; }
    else if (pt.type === 'flame'){ pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx *= 0.88; pt.vy *= 0.88; }
    else if (pt.type === 'orbBreak'){ pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx *= 0.94; pt.vy *= 0.94; }
    else if (pt.type === 'gravityPull'){
      pt.curR -= pt.pullSpeed * dt;
      if (pt.curR <= 6){ pt.life = 0; }
      else {
        pt.x = pt.cx + Math.cos(pt.angle) * pt.curR;
        pt.y = pt.cy + Math.sin(pt.angle) * pt.curR;
      }
    }
  }
  compact(g.particles, function(pt){ return pt.life <= 0; });
  if (g.particles.length > 500) g.particles.splice(0, g.particles.length - 500);

  for (var dti=0;dti<g.damageTexts.length;dti++){
    var dtxt = g.damageTexts[dti];
    dtxt.life -= dt; dtxt.y += dtxt.vy*dt; dtxt.vy *= 0.92;
  }
  compact(g.damageTexts, function(d){ return d.life <= 0; });

  for (var nvi=0;nvi<g.novae.length;nvi++){
    var nv = g.novae[nvi];
    nv.life -= dt;
    if (nv.inward){
      nv.radius = nv.maxRadius * (nv.life / nv.maxLife);
    } else {
      nv.radius = nv.maxRadius * (1 - nv.life/nv.maxLife);
    }
  }
  compact(g.novae, function(n){ return n.life <= 0; });

  for (var lei=0;lei<g.lightningEffects.length;lei++){ g.lightningEffects[lei].life -= dt; }
  compact(g.lightningEffects, function(le){ return le.life <= 0; });

  if (g.screenShake > 0) g.screenShake = Math.max(0, g.screenShake - dt*30);
  if (g.hitFlash > 0) g.hitFlash = Math.max(0, g.hitFlash - dt*3);

  updateBuffBar();
}

function updateBuffBar(){
  var el = document.getElementById('buffBar');
  if (!game) { el.innerHTML = ''; return; }
  var p = game.player;
  var html = '';
  if (p.hasteBuff > 0) html += '<div class="buff-item">⚡ +' + Math.round(p.hasteBuff*100) + '% <span style="color:#ffd76e">' + p.hasteBuffTimer.toFixed(1) + 's</span></div>';
  if (p.powerBuff > 0) html += '<div class="buff-item">💥 +' + Math.round(p.powerBuff*100) + '% <span style="color:#ffd76e">' + p.powerBuffTimer.toFixed(1) + 's</span></div>';
  if (p.gravityBuffTimer > 0) html += '<div class="buff-item">🕳️ +' + Math.round(p.gravityPowBuff*100) + '% <span style="color:#c878ff">' + p.gravityBuffTimer.toFixed(1) + 's</span></div>';
  el.innerHTML = html;
}

function renderDamagePanel(){
  var panel = document.getElementById('damagePanel');
  if (!panel || panel.classList.contains('hidden')) return;
  if (!game) return;
  var stats = game.damageStats;
  var total = 0;
  var entries = [];
  for (var k in stats){
    if (stats[k] > 0){
      total += stats[k];
      entries.push({ key: k, dmg: stats[k] });
    }
  }
  entries.sort(function(a,b){ return b.dmg - a.dmg; });
  var html = '';
  for (var i = 0; i < entries.length; i++){
    var ent = entries[i];
    var name = getDamageSourceName(ent.key);
    var pct = total > 0 ? (ent.dmg / total * 100) : 0;
    html += '<div class="dmg-row">' +
      '<span class="dmg-name">' + name + '</span>' +
      '<span class="dmg-val">' + Math.round(ent.dmg) + '</span>' +
      '<span class="dmg-pct">' + pct.toFixed(1) + '%</span>' +
    '</div>';
  }
  html += '<div class="dmg-row dmg-total">' +
    '<span class="dmg-name">总计</span>' +
    '<span class="dmg-val">' + Math.round(total) + '</span>' +
    '<span class="dmg-pct">100%</span>' +
  '</div>';
  document.getElementById('dmgList').innerHTML = html;
}

function getDamageSourceName(key){
  if (key === '__nova__') return '💠 霜爆新星';
  if (key === '__fireball__') return '🔥 火球卷轴';
  if (key === 'other') return '其他';
  var w = WEAPONS[key];
  if (w) return w.icon + ' ' + w.name;
  return key;
}

function toggleDamagePanel(){
  var panel = document.getElementById('damagePanel');
  if (!panel) return;
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) renderDamagePanel();
}

// ============================================================
//  渲染
// ============================================================
function render(dt){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  drawBackground();
  if (!game) return;

  var g = game;
  var p = g.player;
  var camX = cam.x, camY = cam.y, zl = zoomLevel, hw = W/2, hh = H/2;

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoomLevel, zoomLevel);
  ctx.translate(-W/2, -H/2);
  if (g.screenShake > 0) ctx.translate(rand(-g.screenShake,g.screenShake), rand(-g.screenShake,g.screenShake));

  var halfVW = (W / zoomLevel) / 2 + 500;
  var halfVH = (H / zoomLevel) / 2 + 500;
  var vMinX = camX - halfVW, vMaxX = camX + halfVW;
  var vMinY = camY - halfVH, vMaxY = camY + halfVH;

  for (var bi=0;bi<g.bloodDecals.length;bi++){
    var b = g.bloodDecals[bi];
    if (b.x < vMinX || b.x > vMaxX || b.y < vMinY || b.y > vMaxY) continue;
    var sB = worldToScreen(b.x, b.y);
    ctx.fillStyle = 'rgba(90,20,30,'+b.alpha+')';
    ctx.beginPath(); ctx.arc(sB.x, sB.y, b.r, 0, Math.PI*2); ctx.fill();
  }

  for (var vi=0;vi<g.vortexes.length;vi++){
    var v = g.vortexes[vi];
    if (v.x < vMinX || v.x > vMaxX || v.y < vMinY || v.y > vMaxY) continue;
    var sV = worldToScreen(v.x, v.y);
    var aV = v.life/v.maxLife;
    ctx.save();
    ctx.globalAlpha = aV*0.5;
    ctx.strokeStyle = '#c9b6ff'; ctx.lineWidth = 3;
    ctx.shadowBlur = 20; ctx.shadowColor = '#c9b6ff';
    ctx.beginPath(); ctx.arc(sV.x, sV.y, v.radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // 毒圈渲染（间隔采样，最多20个）
  var toxRenderIdxs = [];
  var toxLen = g.toxinCircles.length;
  if (toxLen > 0){
    var step = Math.max(1, Math.floor(toxLen / 20));
    for (var tri = 0; tri < toxLen && toxRenderIdxs.length < 20; tri += step){
      toxRenderIdxs.push(tri);
    }
    for (var tri2 = 0; tri2 < toxLen && toxRenderIdxs.length < 20; tri2++){
      if (toxRenderIdxs.indexOf(tri2) === -1) toxRenderIdxs.push(tri2);
    }
  }
  for (var trii=0;trii<toxRenderIdxs.length;trii++){
    var tc = g.toxinCircles[toxRenderIdxs[trii]];
    if (tc.x < vMinX || tc.x > vMaxX || tc.y < vMinY || tc.y > vMaxY) continue;
    var sTC = worldToScreen(tc.x, tc.y);
    var aTC = tc.life/tc.maxLife;
    ctx.save();
    ctx.globalAlpha = aTC*0.4;
    ctx.fillStyle = '#2a5a2a';
    ctx.beginPath(); ctx.arc(sTC.x, sTC.y, tc.radius, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = aTC*0.7;
    ctx.strokeStyle = '#5aff5a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sTC.x, sTC.y, tc.radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  for (var gi=0;gi<g.gems.length;gi++){
    var gem = g.gems[gi];
    if (gem.x < vMinX || gem.x > vMaxX || gem.y < vMinY || gem.y > vMaxY) continue;
    var sG = worldToScreen(gem.x, gem.y);
    var pulse = 1 + Math.sin(g.time*8 + gem.x)*0.12;
    ctx.save();
    ctx.fillStyle = '#5aff9a';
    ctx.beginPath(); ctx.arc(sG.x, sG.y, gem.radius*pulse, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c8ffdd';
    ctx.beginPath(); ctx.arc(sG.x, sG.y, gem.radius*0.45*pulse, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  for (var ci=0;ci<g.chests.length;ci++){
    var c = g.chests[ci];
    if (c.opened) continue;
    if (c.x < vMinX || c.x > vMaxX || c.y < vMinY || c.y > vMaxY) continue;
    var sC = worldToScreen(c.x, c.y);
    var bob = Math.sin(c.bob)*3;
    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = '#ffd76e';
    ctx.fillStyle = '#8a5a2a';
    ctx.fillRect(sC.x-14, sC.y-10+bob, 28, 20);
    ctx.fillStyle = '#ffd76e';
    ctx.fillRect(sC.x-14, sC.y-14+bob, 28, 6);
    ctx.fillRect(sC.x-3, sC.y-4+bob, 6, 8);
    ctx.restore();
  }

  for (var ei=0;ei<g.enemies.length;ei++){
    var e = g.enemies[ei];
    if (e.x < vMinX || e.x > vMaxX || e.y < vMinY || e.y > vMaxY) continue;
    drawEnemy(ctx, (e.x - camX) * zl + hw, (e.y - camY) * zl + hh, e);
  }

  drawPlayer(ctx, p);

  if (p.orbitLevel > 0 && p.orbAlive){
    var sO = worldToScreen(p.x, p.y);
    var hpRatio = p.orbHp / p.orbMaxHp;
    var r = p.radius + 7;
    ctx.save();
    ctx.shadowBlur = 20; ctx.shadowColor = '#a8e0ff';
    ctx.strokeStyle = hpRatio > 0.5 ? '#a8e0ff' : (hpRatio > 0.25 ? '#ffd76e' : '#ff5a5a');
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(sO.x, sO.y, r, -Math.PI/2, -Math.PI/2 + Math.PI*2*hpRatio);
    ctx.stroke();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#a8e0ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(sO.x, sO.y, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (p.orbitLevel > 0 && !p.orbAlive){
    var sPr = worldToScreen(p.x, p.y);
    var rPr = p.radius + 7;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#5a5a70'; ctx.lineWidth = 2;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(sPr.x, sPr.y, rPr, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.8;
    ctx.font = 'bold 14px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a8e0ff';
    ctx.fillText(p.orbRespawnTimer.toFixed(1)+'s', sPr.x, sPr.y - rPr - 10);
    ctx.restore();
  }

  for (var epi=0; epi<g.enemyProjectiles.length; epi++){
    var ep = g.enemyProjectiles[epi];
    if (ep.x < vMinX || ep.x > vMaxX || ep.y < vMinY || ep.y > vMaxY) continue;
    var sEp = worldToScreen(ep.x, ep.y);
    ctx.save();
    ctx.fillStyle = ep.color;
    ctx.beginPath(); ctx.arc(sEp.x, sEp.y, ep.radius, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(sEp.x, sEp.y, ep.radius*0.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  var fwTotalCount = 0;
  for (var fwi=0;fwi<g.projectiles.length;fwi++){
    if (g.projectiles[fwi].kind === 'firewhirl') fwTotalCount++;
  }
  var fwSkipCount = Math.max(0, fwTotalCount - 70);
  var fwRendered = 0;
  for (var pi=0;pi<g.projectiles.length;pi++){
    var pr = g.projectiles[pi];
    if (pr.x < vMinX || pr.x > vMaxX || pr.y < vMinY || pr.y > vMaxY) continue;
    if (pr.kind === 'firewhirl'){
      if (fwRendered < fwSkipCount){ fwRendered++; continue; }
      fwRendered++;
    }
    var sP = worldToScreen(pr.x, pr.y);
    ctx.save();
    if (pr.kind === 'magic'){
      ctx.fillStyle = pr.color;
      ctx.beginPath(); ctx.arc(sP.x, sP.y, pr.radius, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(sP.x, sP.y, pr.radius*0.4, 0, Math.PI*2); ctx.fill();
    } else if (pr.kind === 'boomerang'){
      ctx.translate(sP.x, sP.y);
      ctx.rotate(g.time * 10);
      var brR = Math.max(pr.radius, 14);
      ctx.shadowBlur = 16;
      ctx.shadowColor = pr.color;
      ctx.fillStyle = pr.color;
      ctx.beginPath();
      ctx.moveTo(-brR, 0);
      ctx.lineTo(0, -brR);
      ctx.lineTo(brR, 0);
      ctx.lineTo(0, brR);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff8dc';
      ctx.beginPath();
      ctx.arc(0, 0, brR * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-brR * 0.55, 0);
      ctx.lineTo(brR * 0.55, 0);
      ctx.stroke();
    } else if (pr.kind === 'firewhirl'){
      ctx.translate(sP.x, sP.y);
      var rotW = g.time * 9;
      var radW = pr.radius;
      ctx.shadowBlur = 24; ctx.shadowColor = '#ff5a2a';
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ff5a2a';
      ctx.beginPath(); ctx.arc(0, 0, radW, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      var armCols = ['#ffd76e', '#ff8a3d', '#ff5a2a'];
      for (var armI = 0; armI < 3; armI++){
        var armA = rotW + armI * Math.PI*2/3;
        ctx.strokeStyle = armCols[armI];
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (var tStep = 0; tStep <= 1; tStep += 0.15){
          var armR = radW * (0.35 + tStep*0.65);
          var armAngle = armA + tStep * 1.5;
          var ax = Math.cos(armAngle) * armR;
          var ay = Math.sin(armAngle) * armR;
          if (tStep === 0) ctx.moveTo(ax, ay);
          else ctx.lineTo(ax, ay);
        }
        ctx.stroke();
      }
      ctx.shadowBlur = 16; ctx.shadowColor = '#ffd76e';
      ctx.fillStyle = '#fff0a0';
      ctx.beginPath(); ctx.arc(0, 0, radW*0.35, 0, Math.PI*2); ctx.fill();
    } else if (pr.kind === 'missile'){
      ctx.shadowBlur = 20;
      ctx.shadowColor = pr.color;
      ctx.fillStyle = pr.color;
      ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(0, 0, pr.radius*2.2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, pr.radius*0.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = pr.color;
      ctx.beginPath(); ctx.arc(0, 0, pr.radius, 0, Math.PI*2); ctx.fill();
    } else {
      var angPr = Math.atan2(pr.vy, pr.vx);
      ctx.translate(sP.x, sP.y); ctx.rotate(angPr);
      ctx.fillStyle = pr.color;
      ctx.beginPath();
      if (pr.kind === 'knife' || pr.kind === 'shard'){ ctx.moveTo(8,0); ctx.lineTo(-4,-3); ctx.lineTo(-4,3); ctx.closePath(); }
      else if (pr.kind === 'shatter'){ ctx.moveTo(12,0); ctx.lineTo(-6,-5); ctx.lineTo(-6,5); ctx.closePath(); }
      else { ctx.moveTo(10,0); ctx.lineTo(-6,-3); ctx.lineTo(-6,3); ctx.closePath(); }
      ctx.fill();
    }
    ctx.restore();
  }

  for (var ni=0;ni<g.novae.length;ni++){
    var n = g.novae[ni];
    if (n.x < vMinX || n.x > vMaxX || n.y < vMinY || n.y > vMaxY) continue;
    var sN = worldToScreen(n.x, n.y);
    var aN = n.life/n.maxLife;
    ctx.save();
    ctx.globalAlpha = aN*0.7;
    ctx.strokeStyle = n.color || '#a8e8ff';
    ctx.lineWidth = 6*aN + 2;
    ctx.shadowBlur = 20; ctx.shadowColor = n.color || '#a8e8ff';
    ctx.beginPath(); ctx.arc(sN.x, sN.y, n.radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // 裁决之剑渲染
  for (var jsi=0;jsi<g.judgmentSwords.length;jsi++){
    var js2 = g.judgmentSwords[jsi];
    if (js2.x < vMinX || js2.x > vMaxX || js2.y < vMinY || js2.y > vMaxY) continue;
    var sJ2 = worldToScreen(js2.x, js2.y);
    ctx.save();
    ctx.translate(sJ2.x, sJ2.y);
    // 光柱
    var glowGrad = ctx.createLinearGradient(0, -80, 0, 20);
    glowGrad.addColorStop(0, 'rgba(255,200,80,0)');
    glowGrad.addColorStop(0.5, 'rgba(255,200,80,0.25)');
    glowGrad.addColorStop(1, 'rgba(255,200,80,0.05)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(-10, -80, 20, 100);
    // 剑身
    ctx.shadowBlur = 20; ctx.shadowColor = '#ffd76e';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(0, -22); ctx.lineTo(5, -10); ctx.lineTo(3, -6);
    ctx.lineTo(8, -2); ctx.lineTo(0, 6);
    ctx.lineTo(-8, -2); ctx.lineTo(-3, -6); ctx.lineTo(-5, -10);
    ctx.closePath(); ctx.fill();
    // 剑柄
    ctx.fillStyle = '#ffe0a0';
    ctx.fillRect(-2, 6, 4, 8);
    ctx.fillStyle = '#ffd76e';
    ctx.fillRect(-4, 14, 8, 2);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  for (var li=0;li<g.lightningEffects.length;li++){
    var le = g.lightningEffects[li];
    var aL = le.life/le.maxLife;
    var s1 = worldToScreen(le.x1, le.y1);
    var s2 = worldToScreen(le.x2, le.y2);
    ctx.save();
    ctx.globalAlpha = aL;
    ctx.strokeStyle = '#a8e0ff'; ctx.lineWidth = 3;
    ctx.shadowBlur = 14; ctx.shadowColor = '#a8e0ff';
    ctx.beginPath();
    ctx.moveTo(s1.x, s1.y);
    var segs = 4;
    for (var si=1;si<segs;si++){
      var tt2 = si/segs;
      ctx.lineTo(s1.x + (s2.x-s1.x)*tt2 + rand(-12,12), s1.y + (s2.y-s1.y)*tt2 + rand(-12,12));
    }
    ctx.lineTo(s2.x, s2.y);
    ctx.stroke();
    ctx.restore();
  }

  for (var pti=0;pti<g.particles.length;pti++){
    var pt = g.particles[pti];
    if (pt.x < vMinX || pt.x > vMaxX || pt.y < vMinY || pt.y > vMaxY) continue;
    var sPt = worldToScreen(pt.x, pt.y);
    var aPt = pt.life/pt.maxLife;
    if (pt.type === 'slash'){
      ctx.save();
      ctx.globalAlpha = aPt*0.8;
      ctx.translate(sPt.x, sPt.y); ctx.rotate(pt.ang);
      ctx.strokeStyle = pt.color; ctx.lineWidth = 8;
      ctx.shadowBlur = 16; ctx.shadowColor = pt.color;
      ctx.beginPath(); ctx.arc(0, 0, pt.r*0.8, -0.7, 0.7); ctx.stroke();
      ctx.restore();
    } else if (pt.type === 'flame'){
      ctx.save();
      ctx.globalAlpha = aPt;
      ctx.fillStyle = pt.color;
      var rr = (1 - aPt) * 10 + 3;
      ctx.beginPath(); ctx.arc(sPt.x, sPt.y, rr, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = aPt*0.6;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(sPt.x, sPt.y, rr*0.4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else if (pt.type === 'gravityPull'){
      ctx.save();
      ctx.globalAlpha = aPt;
      ctx.fillStyle = pt.color;
      ctx.shadowBlur = 14; ctx.shadowColor = pt.color;
      var rrGP = 2 + (1 - aPt) * 1.5;
      ctx.beginPath(); ctx.arc(sPt.x, sPt.y, rrGP, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else if (pt.type === 'orbBreak'){
      ctx.save();
      ctx.globalAlpha = aPt;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(sPt.x, sPt.y, 3, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = aPt;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(sPt.x, sPt.y, 3*aPt + 1, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  for (var dti=0;dti<g.damageTexts.length;dti++){
    var d = g.damageTexts[dti];
    if (d.x < vMinX || d.x > vMaxX || d.y < vMinY || d.y > vMaxY) continue;
    var sD = worldToScreen(d.x, d.y);
    var aD = d.life/d.maxLife;
    ctx.save();
    ctx.globalAlpha = aD;
    ctx.textAlign = 'center';
    ctx.fillStyle = d.color;
    if (d.crit){
      ctx.font = 'bold 22px "Segoe UI",sans-serif';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(d.text, sD.x, sD.y);
    } else {
      ctx.font = 'bold 16px "Segoe UI",sans-serif';
    }
    ctx.fillText(d.text, sD.x, sD.y);
    ctx.restore();
  }

  ctx.restore();

  if (g.hitFlash > 0){
    ctx.fillStyle = 'rgba(200,30,30,'+(g.hitFlash*0.35)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawHUD(g);
  drawBossBars(g);
  renderDamagePanel();
}

function drawBackground(){
  ctx.fillStyle = '#12121e';
  ctx.fillRect(0,0,W,H);
  var grid = 64 * zoomLevel;
  var ox = ((-cam.x * zoomLevel + W/2) % grid + grid) % grid;
  var oy = ((-cam.y * zoomLevel + H/2) % grid + grid) % grid;
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = ox; x < W; x += grid){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for (var y = oy; y < H; y += grid){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
  var vg = ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.3, W/2,H/2, Math.max(W,H)*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

function drawPlayer(ctx, p){
  var s = worldToScreen(p.x, p.y);
  ctx.save();
  if (p.invuln > 0 && Math.floor(p.invuln*20)%2 === 0) ctx.globalAlpha = 0.4;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(s.x, s.y+12, 14, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 22; ctx.shadowColor = p.color;
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.arc(s.x, s.y, p.radius, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(s.x, s.y, p.radius*0.45, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1208';
  ctx.beginPath(); ctx.arc(s.x + p.facing*7, s.y - 3, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEnemy(ctx, x, y, e){
  ctx.save();
  if (e.isBoss){
    ctx.save();
    ctx.shadowBlur = 30; ctx.shadowColor = e.color;
    ctx.strokeStyle = e.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, e.radius + 6, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(x, y, e.radius + 12, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y+e.radius*0.8, e.radius*0.9, e.radius*0.4, 0, 0, Math.PI*2); ctx.fill();
  var hit = e.hitTimer > 0;
  var frozen = e.freezeTimer > 0;
  var stunned = e.stunTimer > 0;
  var color = hit ? '#ffffff' : (frozen ? '#a8e8ff' : e.color);
  if (stunned && !hit) color = '#ffe87a';
  if (e.slowTimer > 0 && !hit && !frozen && !stunned) color = '#7ec8e0';
  ctx.fillStyle = color;

  if (e.isBoss){
    ctx.beginPath(); ctx.arc(x, y, e.radius, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.arc(x, y, e.radius*0.5, 0, Math.PI*2); ctx.fill();
    ctx.font = Math.floor(e.radius) + 'px "Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.icon, x, y);
  } else if (e.type === 'bat'){
    ctx.beginPath();
    ctx.moveTo(x, y-e.radius); ctx.lineTo(x+e.radius, y);
    ctx.lineTo(x, y+e.radius); ctx.lineTo(x-e.radius, y);
    ctx.closePath(); ctx.fill();
  } else if (e.type === 'brute' || e.type === 'deathknight' || e.type === 'bomber'){
    ctx.fillRect(x-e.radius, y-e.radius, e.radius*2, e.radius*2);
  } else if (e.type === 'wanderer' || e.type === 'lord'){
    ctx.beginPath();
    ctx.moveTo(x, y-e.radius); ctx.lineTo(x+e.radius, y+e.radius);
    ctx.lineTo(x-e.radius, y+e.radius);
    ctx.closePath(); ctx.fill();
  } else if (e.type === 'assassin'){
    ctx.beginPath();
    ctx.moveTo(x, y-e.radius*1.2); ctx.lineTo(x+e.radius, y+e.radius);
    ctx.lineTo(x-e.radius, y+e.radius);
    ctx.closePath(); ctx.fill();
  } else if (e.type === 'archer'){
    ctx.beginPath(); ctx.arc(x, y, e.radius, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.moveTo(x+e.radius, y-e.radius*0.3);
    ctx.lineTo(x+e.radius*1.6, y);
    ctx.lineTo(x+e.radius, y+e.radius*0.3);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x, y, e.radius, 0, Math.PI*2); ctx.fill();
  }

  if (frozen){
    ctx.save(); ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#a8e8ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, e.radius+3, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (stunned){
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#ffe87a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y-e.radius-6, 3, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x-e.radius+2, y-e.radius-2, 3, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+e.radius-2, y-e.radius-2, 3, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (e.burnTimer > 0){
    ctx.save(); ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#ff5a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, e.radius+2, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  if (!e.isBoss){
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath();
    ctx.arc(x-3, y-2, 1.8, 0, Math.PI*2);
    ctx.arc(x+3, y-2, 1.8, 0, Math.PI*2);
    ctx.fill();
  }

  if (e.hp > 0 && e.hp < e.maxHp){
    var w = e.isBoss ? e.radius*2.5 : e.radius*2;
    var ratio = e.hp/e.maxHp;
    var yBar = y - e.radius - (e.isBoss ? 14 : 9);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x-w/2, yBar, w, e.isBoss ? 5 : 3);
    ctx.fillStyle = ratio > 0.5 ? '#6ee06e' : ratio > 0.25 ? '#e0c04a' : '#e05a5a';
    ctx.fillRect(x-w/2, yBar, w*ratio, e.isBoss ? 5 : 3);
  }
  if (e.isBoss){
    ctx.font = 'bold 12px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd76e';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 3;
    ctx.strokeText(e.name, x, y - e.radius - 20);
    ctx.fillText(e.name, x, y - e.radius - 20);
  }
  ctx.restore();
}

function drawHUD(g){
  var p = g.player;
  var barH = 8;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,barH);
  var xpRatio = clamp(g.xp/g.xpNext, 0, 1);
  var grad = ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,'#5aff9a'); grad.addColorStop(1,'#a8ffce');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W*xpRatio,barH);

  ctx.save();
  ctx.font = 'bold 14px "Segoe UI",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 3;
  var lvText = 'Lv.'+g.level;
  ctx.strokeText(lvText, 10, 30);
  ctx.fillText(lvText, 10, 30);
  ctx.restore();

  var hpW = Math.min(240, W*0.32), hpH = 18;
  var hx = 10, hy = 42;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(hx-2, hy-2, hpW+4, hpH+4);
  var hpRatio = clamp(p.hp/p.maxHp, 0, 1);
  var hpGrad = ctx.createLinearGradient(hx,0,hx+hpW,0);
  hpGrad.addColorStop(0,'#e03a3a'); hpGrad.addColorStop(1,'#ff7a5a');
  ctx.fillStyle = hpGrad;
  ctx.fillRect(hx, hy, hpW*hpRatio, hpH);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px "Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(p.hp) + ' / ' + Math.ceil(p.maxHp), hx+hpW/2, hy+13);

  ctx.textAlign = 'left';
  ctx.font = 'bold 16px "Segoe UI",sans-serif';
  ctx.fillStyle = '#ffd76e';
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 3;
  var waveText = '第 ' + g.wave + ' 波';
  ctx.strokeText(waveText, 10, 82);
  ctx.fillText(waveText, 10, 82);

  ctx.font = 'bold 12px "Segoe UI",sans-serif';
  ctx.fillStyle = '#a8a8c0';
  var nextWaveIn = Math.max(0, Math.ceil(g.waveTimer));
  var curHp = 0;
  for (var whi=0; whi<g.enemies.length; whi++){
    var whe = g.enemies[whi];
    if (!whe.dead && g.currentWaveEnemyIds[whe.id]) curHp += whe.hp;
  }
  var hpPct = g.currentWaveTotalHp > 0 ? Math.round(curHp / g.currentWaveTotalHp * 100) : 100;
  ctx.strokeText('下一波: ' + nextWaveIn + 's  ·  本波血量: ' + hpPct + '%', 10, 100);
  ctx.fillText('下一波: ' + nextWaveIn + 's  ·  本波血量: ' + hpPct + '%', 10, 100);
  ctx.fillStyle = '#8a8aa0';
  ctx.strokeText('场上敌人: ' + g.enemies.length, 10, 118);
  ctx.fillText('场上敌人: ' + g.enemies.length, 10, 118);

  ctx.textAlign = 'right';
  ctx.font = 'bold 22px "Segoe UI",sans-serif';
  ctx.fillStyle = '#ffd76e';
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 4;
  var timeText = fmtTime(g.time);
  ctx.strokeText(timeText, W-14, 36);
  ctx.fillText(timeText, W-14, 36);
  ctx.font = 'bold 13px "Segoe UI",sans-serif';
  ctx.fillStyle = '#c8c8d8';
  ctx.strokeText('💀 '+g.kills, W-14, 58);
  ctx.fillText('💀 '+g.kills, W-14, 58);
  ctx.fillStyle = '#ffd76e';
  ctx.fillText('💰 '+g.goldEarned, W-14, 78);

  drawWeaponBar(g);
}

function drawBossBars(g){
  var bosses = [];
  for (var i = 0; i < g.enemies.length; i++){
    var e = g.enemies[i];
    if (e.isBoss && !e.dead) bosses.push(e);
  }
  if (bosses.length === 0) return;

  var barW = Math.min(W * 0.55, 520);
  var barH = 14;
  var startY = 34;
  var gap = 52;

  for (var i = 0; i < bosses.length; i++){
    var b = bosses[i];
    var cx = W / 2;
    var cy = startY + i * gap;
    var x0 = cx - barW / 2;

    ctx.save();
    ctx.font = 'bold 15px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.strokeText(b.name, cx, cy - 5);
    ctx.fillStyle = '#ffe8a0';
    ctx.fillText(b.name, cx, cy - 5);
    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(x0 - 3, cy - 3, barW + 6, barH + 6);
    ctx.strokeStyle = '#c89838';
    ctx.lineWidth = 2;
    ctx.strokeRect(x0 - 3, cy - 3, barW + 6, barH + 6);

    ctx.fillStyle = '#1a0505';
    ctx.fillRect(x0, cy, barW, barH);

    var ratio = Math.max(0, Math.min(1, b.hp / b.maxHp));
    var grad = ctx.createLinearGradient(x0, cy, x0, cy + barH);
    grad.addColorStop(0, '#ff6a6a');
    grad.addColorStop(0.5, '#e02020');
    grad.addColorStop(1, '#801010');
    ctx.fillStyle = grad;
    ctx.fillRect(x0, cy, barW * ratio, barH);

    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 1;
    var segs = 5;
    for (var s = 1; s < segs; s++){
      var sx = x0 + (barW / segs) * s;
      ctx.beginPath();
      ctx.moveTo(sx, cy + 1);
      ctx.lineTo(sx, cy + barH - 1);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x0, cy, barW * ratio, 2);

    ctx.save();
    ctx.font = 'bold 11px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    var hpTxt = Math.ceil(b.hp) + ' / ' + Math.ceil(b.maxHp);
    ctx.strokeText(hpTxt, cx, cy + barH / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(hpTxt, cx, cy + barH / 2);
    ctx.restore();
  }
}

function drawWeaponIconShape(ctx, kind, cx, cy, sz){
  ctx.save();
  var hsz = sz * 0.35;
  ctx.strokeStyle = '#ffffff';
  ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (kind === 'melee'){
    ctx.beginPath();
    ctx.moveTo(cx - hsz, cy - hsz); ctx.lineTo(cx + hsz*0.3, cy - hsz*0.1);
    ctx.lineTo(cx + hsz*0.3, cy + hsz*0.1); ctx.lineTo(cx - hsz, cy + hsz);
    ctx.lineTo(cx - hsz*0.3, cy + hsz*0.1); ctx.lineTo(cx - hsz*0.3, cy - hsz*0.1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - hsz*0.2, cy - hsz*0.5); ctx.lineTo(cx, cy - hsz);
    ctx.stroke();
  }
  else if (kind === 'arrow'){
    ctx.beginPath();
    ctx.moveTo(cx + hsz*0.9, cy);
    ctx.lineTo(cx - hsz*0.5, cy - hsz*0.7);
    ctx.lineTo(cx - hsz*0.1, cy);
    ctx.lineTo(cx - hsz*0.5, cy + hsz*0.7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(cx - hsz*0.8, cy); ctx.lineTo(cx - hsz*0.5, cy);
    ctx.stroke();
  }
  else if (kind === 'magic'){
    ctx.beginPath(); ctx.arc(cx, cy, hsz*0.65, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, hsz*0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy - hsz*0.85); ctx.lineTo(cx, cy + hsz*0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - hsz*0.85, cy); ctx.lineTo(cx + hsz*0.85, cy);
    ctx.stroke();
  }
  else if (kind === 'flame'){
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath(); ctx.ellipse(cx - hsz*0.35, cy + hsz*0.15, hsz*0.2, hsz*0.6, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, cy, hsz*0.18, hsz*0.7, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + hsz*0.35, cy + hsz*0.15, hsz*0.2, hsz*0.6, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd76e';
    ctx.beginPath(); ctx.ellipse(cx, cy - hsz*0.05, hsz*0.12, hsz*0.4, 0, 0, Math.PI*2); ctx.fill();
  }
  else if (kind === 'boomerang'){
    ctx.beginPath();
    ctx.moveTo(cx - hsz*0.7, cy + hsz*0.5);
    ctx.lineTo(cx, cy - hsz*0.4);
    ctx.lineTo(cx + hsz*0.7, cy + hsz*0.5);
    ctx.stroke();
  }
  else if (kind === 'frost'){
    ctx.save();
    for (var fi=0; fi<3; fi++){
      ctx.rotate(fi * Math.PI/3);
      ctx.beginPath();
      ctx.moveTo(cx, cy - hsz*0.8); ctx.lineTo(cx, cy + hsz*0.8);
      ctx.stroke();
    }
    for (var fj=0; fj<3; fj++){
      ctx.rotate(fj * Math.PI/3 + Math.PI/6);
      ctx.beginPath();
      ctx.moveTo(cx, cy - hsz*0.35); ctx.lineTo(cx + hsz*0.2, cy - hsz*0.55);
      ctx.moveTo(cx, cy - hsz*0.35); ctx.lineTo(cx - hsz*0.2, cy - hsz*0.55);
      ctx.stroke();
    }
    ctx.restore();
  }
  else if (kind === 'lightning'){
    ctx.beginPath();
    ctx.moveTo(cx + hsz*0.5, cy - hsz*0.8);
    ctx.lineTo(cx - hsz*0.15, cy);
    ctx.lineTo(cx + hsz*0.15, cy);
    ctx.lineTo(cx - hsz*0.5, cy + hsz*0.8);
    ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(cx + hsz*0.5, cy - hsz*0.8);
    ctx.lineTo(cx - hsz*0.15, cy);
    ctx.lineTo(cx + hsz*0.15, cy);
    ctx.lineTo(cx - hsz*0.5, cy + hsz*0.8);
    ctx.stroke();
  }
  else if (kind === 'firewhirl'){
    ctx.strokeStyle = '#ff8a3d';
    ctx.lineWidth = 2.5;
    var turns = 2.5, rMax = hsz*0.7, rMin = hsz*0.15;
    ctx.beginPath();
    for (var t=0; t<=turns; t+=0.05){
      var frac = t/turns;
      var r = rMax - (rMax-rMin)*frac;
      var ang = t*Math.PI*2;
      var px = cx + Math.cos(ang)*r;
      var py = cy + Math.sin(ang)*r;
      if (t===0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  else if (kind === 'gravity'){
    for (var g=3; g>=1; g--){
      ctx.beginPath();
      ctx.arc(cx, cy, hsz*0.25*g, 0, Math.PI*2);
      ctx.globalAlpha = g/3;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(cx, cy, hsz*0.12, 0, Math.PI*2); ctx.fill();
  }
  else if (kind === 'missile'){
    ctx.fillStyle = '#c878ff';
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(cx, cy, hsz*0.7, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(cx, cy, hsz*0.25, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e0c0ff';
    ctx.beginPath(); ctx.arc(cx, cy, hsz*0.4, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawWeaponBar(g){
  var p = g.player;
  var wids = p.getAllWeaponIds();
  var y = H - 70;
  var x = 12;
  for (var wi=0;wi<wids.length;wi++){
    var wid = wids[wi];
    var w = WEAPONS[wid];
    var isHero = wid === p.heroWeapon;
    var lv = p.getWeaponLevel(wid);
    var mod = p.weaponMods[wid];
    var size = 52;
    var transcended = p.hasTranscended(wid);

    ctx.save();
    if (transcended){
      ctx.save();
      var auraHue = (g.time*120) % 360;
      ctx.shadowBlur = 20; ctx.shadowColor = 'hsl('+auraHue+',90%,65%)';
      ctx.strokeStyle = 'hsl('+auraHue+',90%,65%)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(x-3, y-3, size+6, size+6, 10); ctx.stroke();
      ctx.restore();
    }

    ctx.fillStyle = isHero ? 'rgba(60,45,25,0.85)' : 'rgba(25,35,55,0.85)';
    ctx.strokeStyle = isHero ? '#ffd76e' : '#7ec8ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, size, size, 8); ctx.fill(); ctx.stroke();

    ctx.font = '28px "Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(w.icon, x+size/2, y+size/2-2);

    ctx.font = 'bold 9px "Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd76e';
    if (isHero) ctx.fillText('专属', x+size/2, y+size-8);
    else ctx.fillText('Lv.'+lv, x+size/2, y+size-8);

    if (mod){
      var indP = sumTierCounts(BASE_IND_POWER, mod.powerCounts);
      var indS = sumTierCounts(BASE_IND_SPEED, mod.speedCounts);
      if (indP > 0 || indS > 0){
        ctx.font = 'bold 8px "Segoe UI",sans-serif';
        ctx.fillStyle = '#ff8a6a';
        if (indP > 0) ctx.fillText('+'+Math.round(indP*100)+'%', x+size/4, y - 22);
        ctx.fillStyle = '#7ee08a';
        if (indS > 0) ctx.fillText('+'+Math.round(indS*100)+'%', x+size*3/4, y - 22);
      }
      var miniCount = p.countMiniTranscended(wid);
      if (miniCount > 0){
        ctx.font = 'bold 9px "Segoe UI",sans-serif';
        ctx.fillStyle = transcended ? '#ffd76e' : '#a0d8ff';
        ctx.fillText('✦'+miniCount+'/4', x+size/2, y - 10);
      }
    }
    ctx.restore();
    x += size + 8;
  }

  if (p.orbitLevel > 0){
    var orbSize = 44;
    var ox2 = x + 4;
    ctx.save();
    ctx.fillStyle = 'rgba(20,30,50,0.85)';
    ctx.strokeStyle = p.orbAlive ? '#a8e0ff' : '#5a5a70';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(ox2, y, orbSize, orbSize, 8); ctx.fill(); ctx.stroke();
    ctx.font = '22px "Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = p.orbAlive ? 1 : 0.4;
    ctx.fillText('🔵', ox2+orbSize/2, y+orbSize/2-4);
    ctx.globalAlpha = 1;
    if (p.orbAlive){
      ctx.font = 'bold 9px "Segoe UI",sans-serif';
      var hpPct = Math.round(p.orbHp / p.orbMaxHp * 100);
      ctx.fillStyle = hpPct > 50 ? '#7ee08a' : (hpPct > 25 ? '#ffd76e' : '#ff5a5a');
      ctx.fillText(hpPct+'%', ox2+orbSize/2, y+orbSize-8);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(ox2+2, y+orbSize-4, orbSize-4, 2);
      ctx.fillStyle = hpPct > 50 ? '#7ee08a' : (hpPct > 25 ? '#ffd76e' : '#ff5a5a');
      ctx.fillRect(ox2+2, y+orbSize-4, (orbSize-4)*(p.orbHp/p.orbMaxHp), 2);
    } else {
      ctx.font = 'bold 9px "Segoe UI",sans-serif';
      ctx.fillStyle = '#5a5a70';
      ctx.fillText(p.orbRespawnTimer.toFixed(1)+'s', ox2+orbSize/2, y+orbSize-8);
    }
    ctx.restore();
  }
}

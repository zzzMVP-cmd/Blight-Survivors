function openDetail(){
  buildDetailContent();
  document.getElementById('detailPanel').classList.add('show');
  if (state === 'playing') state = 'paused';
}
function closeDetail(){
  document.getElementById('detailPanel').classList.remove('show');
  if (state === 'paused' && document.getElementById('pausePanel').classList.contains('hidden')){
    state = 'playing';
  }
}
function toggleDetail(){
  var el = document.getElementById('detailPanel');
  if (el.classList.contains('show')) closeDetail();
  else openDetail();
}

function tierCellsHtml(counts){
  var html = '<div class="tier-track">';
  for (var i=0;i<4;i++){
    var n = counts[i] || 0;
    var cls = 'tier-cell';
    if (n > 0) cls += ' on ' + TIER_CLASSES[i];
    html += '<div class="'+cls+'">'+(n>0 ? n : '')+'</div>';
  }
  html += '</div>';
  return html;
}
function tierCountRow(label, counts, base, type){
  var total = sumTierCounts(base, counts);
  return '<div class="dp-bar-row">' +
    '<div class="dp-bar-label">'+label+'</div>' +
    tierCellsHtml(counts) +
    '<div class="dp-bar-val '+type+'">'+(total>0 ? '+'+Math.round(total*100)+'%' : '—')+'</div>' +
  '</div>';
}
function exclusiveRow(wid, p){
  var mod = p.weaponMods[wid];
  var html = '<div class="dp-bar-row"><div class="dp-bar-label">专属阶段</div><div class="tier-track">';
  for (var i=0;i<4;i++){
    var cnt = mod.exclusiveCounts[i];
    var cls = 'tier-cell';
    if (cnt > 0) cls += ' on exclusive';
    if (mod.miniTranscended[i]) cls += ' mini';
    html += '<div class="'+cls+'">'+(cnt>0 ? cnt : '')+'</div>';
  }
  var miniCount = p.countMiniTranscended(wid);
  html += '</div><div class="dp-bar-val exclusive">'+miniCount+'/4</div></div>';
  return html;
}

function buildDetailContent(){
  var g = game;
  if (!g) return;
  var p = g.player;
  var html = [];

  if (p.orbitLevel > 0){
    html.push('<div class="dp-section"><h3>守护光球</h3><div class="dp-grid">');
    var respT = p.getOrbRespawnTime().toFixed(1);
    var capped = p.getOrbRespawnTime() <= 0.65;
    html.push('<div class="dp-item highlight"><div class="dp-item-top"><div class="dp-item-name">🔵 守护光球 Lv.'+p.orbitLevel+'</div><div class="dp-item-badge orb">防守</div></div>' +
      '<div class="dp-note">生命值：<b style="color:#a8e0ff">'+Math.ceil(p.orbHp)+' / '+p.orbMaxHp+'</b><br>' +
      '状态：' + (p.orbAlive ? '存活' : '重生中 '+p.orbRespawnTimer.toFixed(1)+'s') + '<br>' +
      '重生时间：<b style="color:#a8e0ff">'+respT+'s</b>' + (capped ? ' <span style="color:#ffd76e">（已触底）</span>' : '') +
      '<br>吸收伤害时先过护甲</div></div>');
    html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">💠 光球速度</div><div class="dp-item-badge orb">独立乘区</div></div>' +
      tierCountRow('速度', p.orbSpeedCounts, ORB_SPEED_BASE, 'orb') +
      '<div class="dp-note">影响光球重生时间 · 触底后不再出现</div></div>');
    html.push('</div></div>');
  }

  if (p.novaLevel > 0){
    var novaPowerBonus = sumTierCounts(NOVA_POWER_BASE, p.novaPowerCounts);
    var novaSpeedBonus = sumTierCounts(NOVA_SPEED_BASE, p.novaSpeedCounts);
    var baseInterval = Math.max(1.6, 3.5 - p.novaLevel*0.35);
    var actualInterval = baseInterval / (1 + novaSpeedBonus);
    html.push('<div class="dp-section"><h3>霜爆新星</h3><div class="dp-grid">');
    html.push('<div class="dp-item highlight"><div class="dp-item-top"><div class="dp-item-name">💠 霜爆新星 Lv.'+p.novaLevel+'</div><div class="dp-item-badge orb">攻击</div></div>' +
      '<div class="dp-note">伤害：<b style="color:#a8e8ff">'+Math.round(20 * (1 + novaPowerBonus))+'</b><br>' +
      '半径：<b style="color:#a8e8ff">'+Math.round(110 + p.novaLevel*35)+'</b><br>' +
      '触发间隔：<b style="color:#a8e8ff">'+actualInterval.toFixed(2)+'s</b></div></div>');
    html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">💪 新星力量</div><div class="dp-item-badge orb">独立乘区</div></div>' +
      tierCountRow('力量', p.novaPowerCounts, NOVA_POWER_BASE, 'orb') + '<div class="dp-note">影响新星伤害</div></div>');
    html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">⚡ 新星速度</div><div class="dp-item-badge orb">独立乘区</div></div>' +
      tierCountRow('速度', p.novaSpeedCounts, NOVA_SPEED_BASE, 'orb') + '<div class="dp-note">影响新星触发间隔</div></div>');
    html.push('</div></div>');
  }

  html.push('<div class="dp-section"><h3>全体增幅</h3><div class="dp-grid">');
  html.push('<div class="dp-item highlight"><div class="dp-item-top"><div class="dp-item-name">🔥 全体力量</div><div class="dp-item-badge global">独立乘区</div></div>' +
    tierCountRow('力量', p.globalPowerCounts, BASE_GLOBAL_POWER, 'global') + '</div>');
  html.push('<div class="dp-item highlight"><div class="dp-item-top"><div class="dp-item-name">💨 全体速度</div><div class="dp-item-badge global">独立乘区</div></div>' +
    tierCountRow('速度', p.globalSpeedCounts, BASE_GLOBAL_SPEED, 'global') + '</div>');
  html.push('</div></div>');

  var wids = p.getAllWeaponIds();
  html.push('<div class="dp-section"><h3>武器增幅</h3><div class="dp-grid">');
  for (var wi=0;wi<wids.length;wi++){
    var wid = wids[wi];
    var w = WEAPONS[wid];
    var mod = p.weaponMods[wid];
    var stats = p.getWeaponStats(wid);
    var isHero = wid === p.heroWeapon;
    var lv = p.getWeaponLevel(wid);
    var typeName = w.wtype === 'attack' ? '攻击型' : w.wtype === 'control' ? '控制型' : w.wtype === '终结' ? '终结型' : '功能型';
    var transcended = p.hasTranscended(wid);
    var miniCount = p.countMiniTranscended(wid);
    var badge = isHero ? '<div class="dp-item-badge hero">角色专属</div>' : '<div class="dp-item-badge">Lv.'+lv+' · '+typeName+'</div>';
    if (transcended) badge = '<div class="dp-item-badge transcend">✦ 大质变</div>';
    else if (miniCount > 0) badge = '<div class="dp-item-badge mini">✦ '+miniCount+'/4</div>';

    html.push('<div class="dp-item'+(transcended?' transcended':'')+'">');
    html.push('<div class="dp-item-top"><div class="dp-item-name">'+w.icon+' '+w.name+'</div>'+badge+'</div>');
    if (w.noPower){
      html.push('<div class="dp-bar-row"><div class="dp-bar-label">独立力量</div><div style="flex:1;font-size:11px;color:#6a6a80">— 不受力量加成 —</div></div>');
    } else {
      html.push(tierCountRow('独立力量', mod.powerCounts, BASE_IND_POWER, 'power'));
    }
    html.push(tierCountRow('独立速度', mod.speedCounts, BASE_IND_SPEED, 'speed'));
    html.push(exclusiveRow(wid, p));
    var infoLine = '伤害 <b style="color:#ff9a6a">'+Math.round(stats.dmg)+'</b> · 攻击间隔 <b style="color:#7ee08a">'+stats.atkInterval.toFixed(3)+'s</b> · 击退 <b style="color:#a8e0ff">'+Math.round(stats.knockback)+'</b>';
    html.push('<div class="dp-note">'+infoLine+'</div>');
    if (stats.overflowAmount > 0){
      html.push('<div class="overflow-note">⚡ 溢出 +' + Math.round(stats.overflowAmount*100) + '% → 伤害 ×' + stats.overflowDmgMult.toFixed(2) + '</div>');
    }
    if (transcended) html.push('<div class="transcend-note">✦ 已质变：'+w.exclusiveName+'</div>');
    html.push('</div>');
  }
  html.push('</div></div>');

  html.push('<div class="dp-section"><h3>角色属性</h3><div class="dp-grid">');
  html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">❤️ 生命</div></div><div class="dp-note">'+Math.ceil(p.hp)+' / '+Math.ceil(p.maxHp)+'</div></div>');
  html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">💢 暴击率</div></div><div class="dp-note">'+Math.round(p.critChance*100)+'%（暴击 ×4 伤害）</div></div>');
  html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">🛡️ 减伤</div></div><div class="dp-note">'+Math.round((1-p.armorMult)*100)+'%</div></div>');
  html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">🧲 拾取范围</div></div><div class="dp-note">'+Math.round(p.pickupRange)+'</div></div>');
  html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">🌊 波次</div></div><div class="dp-note">第 '+g.wave+' 波 · 下一波 '+Math.ceil(g.waveTimer)+'s</div></div>');
  html.push('<div class="dp-item"><div class="dp-item-top"><div class="dp-item-name">👑 Boss 波</div></div><div class="dp-note">已出现 '+g.bossWaveIndex+' 次</div></div>');
  html.push('</div></div>');

  document.getElementById('dpContent').innerHTML = html.join('');
}

var tbTimer = null;
function showTranscendBanner(text){
  var el = document.getElementById('transcendBanner');
  document.getElementById('tbSub').textContent = text;
  el.classList.add('show');
  clearTimeout(tbTimer);
  tbTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 1600);
}
function showPanel(id){
  var els = document.querySelectorAll('.overlay');
  for (var i=0;i<els.length;i++) els[i].classList.add('hidden');
  if (id) document.getElementById(id).classList.remove('hidden');
}

function buildHeroGrid(){
  var grid = document.getElementById('heroGrid');
  if (!grid) return;
  grid.innerHTML = '';
  var goldEl = document.getElementById('menuGold');
  if (goldEl) goldEl.textContent = save.gold;
  for (var key in HEROES){
    var h = HEROES[key];
    var unlocked = (key === 'warlord') ? save.warlordUnlocked : (save.unlocked.indexOf(key) >= 0);
    var hw = WEAPONS[h.heroWeapon];
    var card = document.createElement('div');
    card.className = 'hero-card' + (unlocked ? '' : ' locked');
    var fragHtml = '';
    if (key === 'warlord' && !unlocked){
      var fragCollected = 0;
      for (var fk in save.fragments){ if (save.fragments[fk]) fragCollected++; }
      fragHtml = '<div class="hero-fragments">碎片 <b>' + fragCollected + '</b> / 5</div>';
    }
    card.innerHTML =
      '<div class="hero-icon">'+h.icon+'</div>' +
      '<div class="hero-name">'+h.name+'</div>' +
      '<div class="hero-desc">'+h.desc+'</div>' +
      '<div class="hero-weapon">'+hw.icon+' '+hw.name+'</div>' +
      fragHtml +
      (unlocked ? '' : (key === 'warlord' ? '' : '<div class="hero-cost">💰 '+h.cost+'</div>'));
    (function(k, isUnlocked, cost, name){
      card.onclick = function(){
        if (isUnlocked) startGame(k);
        else if (k === 'warlord'){
          var frags = 0;
          for (var fk2 in save.fragments){ if (save.fragments[fk2]) frags++; }
          if (frags >= 5){
            save.warlordUnlocked = true;
            persist();
            showTranscendBanner('🌟 天神下凡！武曲星已解锁！');
            toast('🌟 武曲星已解锁！');
            setTimeout(function(){ buildHeroGrid(); }, 1500);
          } else {
            toast('需要集齐 5 块碎片（当前 ' + frags + '/5）');
          }
        }
        else if (save.gold >= cost){
          save.gold -= cost;
          save.unlocked.push(k);
          persist();
          toast('解锁 '+name+'！');
          buildHeroGrid();
        } else toast('金币不足');
      };
    })(key, unlocked, h.cost, h.name);
    grid.appendChild(card);
  }
}

function formatGold(n){
  if (n >= 10000) return Math.round(n/1000) + 'k';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return '' + n;
}

function buildShop(){
  var grid = document.getElementById('shopGrid');
  if (!grid) return;
  grid.innerHTML = '';
  document.getElementById('shopGold').textContent = save.gold;
  for (var i=0;i<ITEM_DEFS.length;i++){
    var def = ITEM_DEFS[i];
    var owned = save.items[def.key] || 0;
    var item = document.createElement('div');
    item.className = 'shop-item';
    var qtyOptions = [1, 5, 10];
    var btnHtml = '';
    for (var q=0; q<qtyOptions.length; q++){
      var qn = qtyOptions[q];
      var total = def.price * qn;
      var canAfford = save.gold >= total;
      var label = (qn === 1)
        ? '💰 ' + formatGold(def.price)
        : 'x' + qn + ' · ' + formatGold(total);
      var cls = 'shop-item-price' + (qn > 1 ? ' small' : '') + (canAfford ? '' : ' disabled');
      btnHtml += '<div class="' + cls + '" data-qty="' + qn + '">' + label + '</div>';
    }
    item.innerHTML =
      '<div class="shop-item-icon">'+def.icon+'</div>' +
      '<div class="shop-item-name">'+def.name+'</div>' +
      '<div class="shop-item-desc">'+def.desc+'</div>' +
      '<div class="shop-item-owned">已拥有：'+owned+'</div>' +
      '<div class="shop-item-price-row">' + btnHtml + '</div>';
    (function(d){
      var btns = item.querySelectorAll('.shop-item-price');
      for (var b=0;b<btns.length;b++){
        (function(btn){
          btn.onclick = function(){
            var qty = parseInt(btn.getAttribute('data-qty'));
            var total = d.price * qty;
            if (save.gold < total){ toast('❌ 金币不足'); return; }
            save.gold -= total;
            save.items[d.key] = (save.items[d.key] || 0) + qty;
            persist();
            toast('✅ 购买 ' + d.icon + ' ' + d.name + ' x' + qty);
            buildShop();
            buildHeroGrid();
          };
        })(btns[b]);
      }
    })(def);
    grid.appendChild(item);
  }
}

function startGame(heroKey){
  try {
    game = createGame(heroKey);
    caiPity = 0;
    state = 'playing';
    cam.x = 0; cam.y = 0;
    zoomLevel = 1.0;
    mouseScreen.inited = false;
    game.chestTimer = 14;
    game.waveTimer = 5;
    game.waveActive = false;
    game.wave = 0;
    game.waveSpawnQueue = [];
    game.waveSpawnTimer = 0;
    game.waveXpMult = 1;
    game.currentWaveTotalHp = 0;
    game.currentWaveEnemyIds = {};
    game.currentWaveSpawnedCount = 0;
    game.bossWaveIndex = 0;
    showPanel(null);
    buildHeroGrid();
    updateItemBar();
    updateBuffBar();
  } catch(err){
    console.error('启动失败:', err);
    alert('启动失败: ' + err.message);
  }
}

function updateItemBar(){
  var el = document.getElementById('itemBar');
  if (!el) return;
  if (!game){ el.innerHTML = ''; return; }
  var p = game.player;
  var html = '';
  for (var i=0;i<ITEM_DEFS.length;i++){
    var def = ITEM_DEFS[i];
    var cnt = p.items[def.key] || 0;
    var empty = cnt <= 0;
    html += '<div class="item-slot' + (empty?' empty':'') + '" data-idx="'+i+'" title="'+def.name+'">' +
      def.icon +
      '<span class="item-key">' + (i+1) + '</span>' +
      (cnt > 0 ? '<span class="item-count">'+cnt+'</span>' : '') +
    '</div>';
  }
  el.innerHTML = html;
  var slots = el.querySelectorAll('.item-slot');
  for (var j=0;j<slots.length;j++){
    slots[j].onclick = function(){
      var idx = parseInt(this.getAttribute('data-idx'));
      useItem(idx);
    };
  }
}

function pauseGame(){ state = 'paused'; showPanel('pausePanel'); }
function resumeGame(){ state = 'playing'; showPanel(null); }

function endGame(reason){
  if (state === 'gameover') return;
  state = 'gameover';
  var g = game;
  var earned = g.goldEarned + Math.floor(g.time*0.5) + g.kills;
  save.gold += earned;
  for (var k in g.player.items){ save.items[k] = g.player.items[k] || 0; }
  persist();
  document.getElementById('goTime').textContent = fmtTime(g.time);
  document.getElementById('goKills').textContent = g.kills;
  document.getElementById('goWave').textContent = g.wave;
  document.getElementById('goLevel').textContent = g.level;
  document.getElementById('goGold').textContent = earned;

  var isExtract = (reason === 'extract');
  document.getElementById('goTitle').textContent = isExtract ? '撤 离 成 功' : '你 死 了';
  document.getElementById('goSub').textContent = isExtract ? '你带着战利品平安离开' : 'Blight 吞噬了一切';

  document.getElementById('itemBar').innerHTML = '';
  document.getElementById('buffBar').innerHTML = '';
  document.getElementById('damagePanel').classList.add('hidden');
  showPanel('gameOverPanel');
}

function bindUI(){
  document.getElementById('startBtn').onclick = function(){ startGame(save.unlocked[0] || 'warrior'); };
  document.getElementById('shopBtn').onclick = function(){ buildShop(); showPanel('shopPanel'); };
  document.getElementById('shopBackBtn').onclick = function(){ buildHeroGrid(); showPanel('menuPanel'); };
  document.getElementById('resumeBtn').onclick = resumeGame;
  document.getElementById('detailBtn').onclick = function(){
    document.getElementById('pausePanel').classList.add('hidden');
    openDetail();
  };
  document.getElementById('dmgBtn').onclick = toggleDamagePanel;
  document.getElementById('dpClose').onclick = function(){
    closeDetail();
    if (state === 'paused') showPanel('pausePanel');
  };
  document.getElementById('quitBtn').onclick = function(){
    if (!game) return;
    var earned = game.goldEarned + Math.floor(game.time*0.5) + game.kills;
    if (!confirm('确定要主动撤离吗？\n\n本局获得的 💰 ' + earned + ' 金币将全部结算。')) return;
    endGame('extract');
  };
  document.getElementById('retryBtn').onclick = function(){ startGame(game ? game.player.heroKey : 'warrior'); };
  document.getElementById('menuBtn').onclick = function(){
    state = 'menu'; game = null;
    buildHeroGrid(); showPanel('menuPanel');
    document.getElementById('itemBar').innerHTML = '';
    document.getElementById('buffBar').innerHTML = '';
    document.getElementById('damagePanel').classList.add('hidden');
  };
  document.getElementById('refreshBtn').onclick = function(){ doRefresh(); };

  var volSlider = document.getElementById('volumeSlider');
  var volVal = document.getElementById('volumeVal');
  var sfxToggle = document.getElementById('sfxToggle');
  volSlider.value = Math.round(masterVolume * 100);
  volVal.textContent = Math.round(masterVolume * 100) + '%';
  sfxToggle.textContent = sfxEnabled ? '🔊' : '🔇';
  volSlider.oninput = function(){
    masterVolume = this.value / 100;
    volVal.textContent = this.value + '%';
    setMasterGain();
    try {
      localStorage.setItem('blight_volume', masterVolume);
      localStorage.setItem('blight_sfx', sfxEnabled ? '1' : '0');
    } catch(e){}
  };
  sfxToggle.onclick = function(){
    sfxEnabled = !sfxEnabled;
    this.textContent = sfxEnabled ? '🔊' : '🔇';
    setMasterGain();
    try { localStorage.setItem('blight_sfx', sfxEnabled ? '1' : '0'); } catch(e){}
  };

  var kbBossSlider = document.getElementById('kbBossSlider');
  var kbBossVal = document.getElementById('kbBossVal');
  var kbNormalSlider = document.getElementById('kbNormalSlider');
  var kbNormalVal = document.getElementById('kbNormalVal');
  kbBossSlider.value = kbLimitBoss;
  kbBossVal.textContent = kbLimitBoss;
  kbNormalSlider.value = kbLimitNormal;
  kbNormalVal.textContent = kbLimitNormal;
  kbBossSlider.oninput = function(){
    kbLimitBoss = parseFloat(this.value);
    kbBossVal.textContent = this.value;
    try { localStorage.setItem('blight_kb_boss', kbLimitBoss); } catch(e){}
  };
  kbNormalSlider.oninput = function(){
    kbLimitNormal = parseFloat(this.value);
    kbNormalVal.textContent = this.value;
    try { localStorage.setItem('blight_kb_normal', kbLimitNormal); } catch(e){}
  };

  var ctrlToggle = document.getElementById('ctrlToggle');
  function updateCtrlLabel(){
    ctrlToggle.textContent = (controlMode === 'mouse') ? '🖱️ 鼠标' : '⌨️ 键盘';
  }
  updateCtrlLabel();
  ctrlToggle.onclick = function(){
    controlMode = (controlMode === 'mouse') ? 'keyboard' : 'mouse';
    updateCtrlLabel();
    joystick.active = false; joystick.dx = 0; joystick.dy = 0;
    try { localStorage.setItem('blight_control', controlMode); } catch(e){}
  };
}

try {
  bindUI();
  buildHeroGrid();
  showPanel('menuPanel');
} catch(err){
  console.error('初始化错误:', err);
}

})();
</script>
